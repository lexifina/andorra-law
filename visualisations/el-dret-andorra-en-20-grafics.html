* { box-sizing: border-box; }

// 3. the Constitution

      `The Constitution of the Principality of Andorra, of 28 April 1993, published in the BOPA and in force on ${dateTxt(c.pub)}: a preamble, ${fmt(arts.length)} articles in ${tits.length} titles and ${disp.length} provisions, ${fmt(c.words)} words. Title II, on rights and freedoms, is the longest: ${t2.arts.length} articles and ${fmt(wordsT(t2))} words. Each square is an article, darker the more laws cite it by number (“article 57 of the Constitution”); ${fmt(c.cites)} citations in ${fmt(c.laws_citing)} of the ${fmt(c.n)} laws. Outlined, the ${res.length} articles that mention qualified laws. The record holds a single text of it, that of 1993, and no law states a change to it.`),

      legend(el, CBIN.map(([a, b], i) => ({ c: i ? ramp(.18 + .82 * i / (CBIN.length - 1)) : css('--surface-2'), l: i === 0 ? L('cap llei', 'no law') : b > 1e8 ? L(`${a} lleis o més`, `${a} laws or more`) : a === b ? lleis(a) : L(`${a}–${b} lleis`, `${a}–${b} laws`) }))
        .concat([{ c: css('--text'), l: L('parla de lleis qualificades', 'mentions qualified laws'), shape: 'outline' }]));
      const w = W(el), nw = narrow(w), s = nw ? 15 : 17, gp = 3, rows = tits.map(tt => ({ lab: `${tt.r}. ${LA(TITN[tt.r] || [tt.r, tt.r])}`, arts: tt.arts, words: wordsT(tt) }))

        });
      });
      legend(el, [{ c: css('--s1'), l: L('edició d’un codi', 'edition of a code') }, { c: css('--s7'), l: L('text consolidat', 'consolidated text') }, { c: css('--s3'), l: L('llei de la persona i de la família', 'person and family law') },
        { c: css('--surface-2'), l: L('en vigor des del 13 de desembre del 2026 (branca future)', 'in force from 13 December 2026 (future branch)'), shape: 'hatch' }]);
      note(el, ['laws.csv (title, in_force)', 'lleis/<ANY>-<NÚMERO>/disposicio-derogatoria*.md'], `${fmt(sum(lanes, ln => ln.eds.length))} ${L('lleis', 'laws')}`,
        L(`cada barra va de l’entrada en vigor d’una edició a la de la següent; la línia de punts és el final de les dades (${dateTxt(PF.record_to)}). La llei qualificada de modificació del Codi de procediment penal del 1998 hi és com a segona edició perquè és un text sencer (273 articles), i la Llei de relacions laborals del 2018, que deroga el Codi de relacions laborals, com a successora. Si l’edició següent deroga l’anterior es llegeix de la seva disposició derogatòria (vegeu la informació en passar el ratolí). Els canvis declarats són els de data/amendments.csv.`,
          `each bar runs from one edition’s entry into force to the next one’s; the dotted line is the end of the data (${dateTxt(PF.record_to)}). The 1998 qualified law amending the Code of Criminal Procedure is drawn as its second edition because it is a full text (273 articles), and the 2018 Labour Relations Act, which repeals the Labour Relations Code, as its successor. Whether the next edition repeals the earlier one is read from its derogatory provision (hover). Stated changes are those of data/amendments.csv.`));
      table(el, [L('Codi', 'Code'), L('Llei', 'Law'), L('Aprovació', 'Approved'), L('En vigor', 'In force'), L('Paraules', 'Words'), L('Articles', 'Articles'), L('Lleis que hi declaren canvis', 'Laws stating changes')],
        lanes.flatMap(ln => ln.eds.map(e => [LA(CDN[ln.key]), citeOf(e.f), dateTxt(e.ad), e.inf ? dateTxt(e.inf) : '–', e.words, e.art, e.by || 0])));
    }
  };
});

// 6. length
chart('c06', el => {
  const c = D.c06, P = c.periods, p0 = P[0], p1 = P[P.length - 1];
  return {
    title: L(`Les lleis noves s’allarguen: ${fmt(Math.round(p0.med))} paraules de mediana el ${p0.p[0]}–${p0.p[1]}, ${fmt(Math.round(p1.med))} des del ${p1.p[0]}`,
      `New laws grow longer: a median of ${fmt(Math.round(p0.med))} words in ${p0.p[0]}–${p0.p[1]}, ${fmt(Math.round(p1.med))} since ${p1.p[0]}`),
    toc: L('La llargada', 'Length'),
    dek: L(`Les paraules de les ${fmt(c.n_new)} lleis noves (sense pressupostos, crèdits, modificacions ni textos consolidats), comptades en els articles, les disposicions i els annexos, sense el preàmbul. La mediana es multiplica per ${dec(p1.med / p0.med, 1)}, i l’exposició de motius passa de ${fmt(p0.motius)} a ${fmt(p1.motius)} paraules. Tot el registre suma ${fmt(c.total_words)} paraules; la llei més llarga és el Codi de procediment civil del 2018.`,
      `The words of the ${fmt(c.n_new)} new laws (without budgets, credits, amendments or consolidated texts), counted in their articles, provisions and annexes, without the preamble. The median grows ${dec(p1.med / p0.med, 1)} times, and the statement of reasons goes from ${fmt(p0.motius)} to ${fmt(p1.motius)} words. The whole record adds up to ${fmt(c.total_words)} words; the longest law is the 2018 Code of Civil Procedure.`),
    draw(el) {
      const nw = narrow(W(el)), cards = el.append('div').attr('class', 'ptiles').style('grid-template-columns', `repeat(${nw ? 2 : 5}, minmax(0, 1fr))`);
      P.forEach((p, i) => {
        const d = cards.append('div').attr('class', 'ptile');
        d.append('div').attr('class', 'pn').text(`${p.p[0]}–${p.p[1]}${i === P.length - 1 ? ' *' : ''}`);
        d.append('div').attr('class', 'pv').html(`<b>${fmt(Math.round(p.med))}</b> ${L('paraules', 'words')}`);
        d.append('div').attr('class', 'ps').text(L(`mediana de ${fmt(p.n)} lleis noves · exposició de motius: ${fmt(Math.round(p.motius))}`, `median of ${fmt(p.n)} new laws · statement of reasons: ${fmt(Math.round(p.motius))}`));
      });
      const pts = YEARS.filter(yy => c.years[yy].n >= 3).map(yy => [yy, Math.round(c.years[yy].med), c.years[yy].n]);
      const r = yearLines(el, [{ pts, color: css('--s1'), area: true, maxGap: 3 }], { x0: 1989, x1: LASTY, yMax: d3.max(pts, p => p[1]), ticks: yearTicks(1989, LASTY, 5), ticksN: yearTicks(1989, LASTY, 10),
        tip: yy => c.years[yy].n ? `<b>${yy}${yy === LASTY ? ' (' + t('partial') + ')' : ''}</b>` + trow(null, L('Lleis noves', 'New laws'), fmt(c.years[yy].n)) + trow(null, L('Mediana de paraules', 'Median words'), fmt(Math.round(c.years[yy].med))) + trow(null, L('La més llarga', 'Longest'), fmt(c.years[yy].max)) + (c.years[yy].n < 3 ? `<div class="q">${L('menys de tres lleis noves: fora de la línia', 'fewer than three new laws: left off the line')}</div>` : '') : `<b>${yy}</b><div class="q">${L('cap llei nova', 'no new law')}</div>` });
      const f = pts[0], l = pts[pts.length - 1], mx = pts.reduce((a, b) => b[1] > a[1] ? b : a, pts[0]);
      halo(r.g, r.x(f[0]) + 6, r.y(f[1]) - 8, fmt(f[1]), 'start');
      halo(r.g, r.x(l[0]) + 7, r.y(l[1]) + 4, fmt(l[1]), 'start');
      halo(r.g, r.x(mx[0]) - 6, r.y(mx[1]) + 4, `${mx[0]}: ${fmt(mx[1])}`, 'end');
      h4(el, L('Les lleis més llargues del registre', 'The longest laws in the record'), 16);
      barList(el, c.longest.slice(0, 12), { label: rr => `${yr(rr[2])} · ${nm(rr[0])}`, value: rr => rr[3], color: rr => rr[5] === 'consol' ? css('--s7') : css('--s1'), cap: 470, rw: narrow(W(el)) ? 64 : 124,
        right: (rr, nw2) => nw2 ? fmt(rr[3]) : `${fmt(rr[3])} · ${fmt(rr[4])} art.`,
        tip: d => `<b>${esc(nmc(d[0]))}</b>${official(d[0])}` + trow(null, L('Paraules', 'Words'), fmt(d[3])) + trow(null, L('Articles', 'Articles'), fmt(d[4])) + (d[6] === 'future' ? `<div class="q">${L('En vigor el 13 de desembre del 2026 (branca future)', 'In force on 13 December 2026 (future branch)')}</div>` : '') });
      legend(el, [{ c: css('--s1'), l: L('llei', 'law') }, { c: css('--s7'), l: L('text consolidat', 'consolidated text') }]);
      note(el, ['lleis/<ANY>-<NÚMERO>/article-*.md', 'disposicio-*.md', 'annex*.md', 'preamble.md'], `${fmt(c.n_new)} ${L('lleis noves', 'new laws')}`,
        L(`una paraula és un tros de text entre espais amb alguna lletra o xifra. L’exposició de motius és el que segueix el darrer títol «Exposició de motius» o «Preàmbul» del preàmbul. La línia deixa fora els anys amb menys de tres lleis noves (la taula els dona); el ${LASTY} arriba al ${dateTxt(PF.last_pub)}.`,
          `a word is a run of text between spaces holding a letter or digit. The statement of reasons is what follows the last “Exposició de motius” or “Preàmbul” heading of the preamble. The line leaves out years with fewer than three new laws (the table has them); ${LASTY} runs to ${dateTxt(PF.last_pub)}.`));
      table(el, [t('year'), L('Lleis noves', 'New laws'), L('Mediana de paraules', 'Median words'), L('La més llarga', 'Longest')], YEARS.map(yy => [String(yy), c.years[yy].n, c.years[yy].med == null ? '–' : Math.round(c.years[yy].med), c.years[yy].max == null ? '–' : c.years[yy].max]));
      subTable(el, L('Les lleis més llargues', 'The longest laws'), [L('Llei', 'Law'), L('Paraules', 'Words'), L('Articles', 'Articles')], c.longest.map(rr => [nmc(rr[0]), rr[3], rr[4]]), [0, 1, 1]);
    }
  };
});

part('p2', 'II. Com neix una llei: sanció, calendari, publicació i vigència', 'II. How a law is made: sanction, calendar, publication and entry into force',
  'Cada llei porta la data en què el Consell General la va aprovar, la signatura del síndic general i, des del 1993, la dels dos coprínceps, que la sancionen i n’ordenen la publicació; després, el dia que surt al BOPA i el dia que entra en vigor. També canvia com s’escriu.',
  'Each law carries the date the Consell General approved it, the Síndic General’s signature and, since 1993, those of the two co-princes, who sanction it and order its publication; then the day it appears in the BOPA and the day it enters into force. How laws are written changes too.');

// 7. the co-princes' signatures
const CPC = { both: () => css('--muted-mark'), fr: () => css('--s1'), ep: () => css('--s2') };
const cpName = k => LA({ both: ['els dos coprínceps', 'both co-princes'], fr: ['només el copríncep francès', 'the French co-prince alone'], ep: ['només el copríncep episcopal', 'the episcopal co-prince alone'] }[k]);
chart('c07', el => {
  const c = D.c07, P = c.princes, laws = c.laws, one = laws.filter(l => l[2] !== 'both'), nfr = one.filter(l => l[2] === 'fr').length, nep = one.filter(l => l[2] === 'ep').length;
  const frq = one.filter(l => l[2] === 'fr' && l[6] && !/^(Modificació|Amendment)/.test(nm(l[0]))).map(l => l[0]);
  const stem = f => LANG === 'ca' ? nm(f).replace(/^Llei qualificada /, '') : nm(f).replace(/^Qualified Law on /, '').toLowerCase();
  const epd = d3.rollups(one.filter(l => l[2] === 'ep'), v => v.length, l => l[1]).sort((a, b) => b[1] - a[1]).slice(0, 2).sort((a, b) => a[0] < b[0] ? -1 : 1);
  const num = n => LA({ 1: ['una', 'one'], 2: ['dues', 'two'], 3: ['tres', 'three'], 4: ['quatre', 'four'], 5: ['cinc', 'five'] }[n] || [fmt(n), fmt(n)]);
  return {
    title: L(`${fmt(one.length)} lleis porten la signatura d’un sol copríncep: ${fmt(nfr)} només la del president francès i ${fmt(nep)} només la del bisbe d’Urgell`,
      `${fmt(one.length)} laws carry only one co-prince’s signature: ${fmt(nfr)} the French president’s alone and ${fmt(nep)} the Bishop of Urgell’s alone`),
    toc: L('Els coprínceps', 'The co-princes'),
    dek: L(`Els coprínceps, el bisbe d’Urgell i el president de la República Francesa, sancionen i promulguen les lleis (article 45 de la Constitució); si circumstàncies impedeixen a un d’ells formalitzar-les dins el termini, entren en vigor amb la signatura de l’altre (article 45.3). De les ${fmt(laws.length)} lleis aprovades des del 1993, ${fmt(laws.length - one.length)} porten totes dues signatures. Només la del copríncep francès porten, entre d’altres, les lleis qualificades ${andList(frq.map(f => stem(f) + ' (' + yr(adOf(f)) + ')'))}. Només la del bisbe, ${andList(epd.map(([d, n]) => num(n) + ' lleis del ' + dateTxt(d)))}; a les signatures, el copríncep francès és Nicolas Sarkozy fins al ${dateTxt(P.sarkozy.last)} i François Hollande des del ${dateTxt(P.hollande.first)}, i Hollande fins al ${dateTxt(P.hollande.last)} i Emmanuel Macron des del ${dateTxt(P.macron.first)}.`,
      `The co-princes, the Bishop of Urgell and the President of the French Republic, sanction and promulgate the laws (Constitution, article 45); if circumstances prevent one of them from doing so within the time limit, a law enters into force with the other’s signature (article 45.3). Of the ${fmt(laws.length)} laws approved since 1993, ${fmt(laws.length - one.length)} carry both signatures. The French co-prince’s alone is on, among others, the qualified laws on ${andList(frq.map(f => stem(f) + ' (' + yr(adOf(f)) + ')'))}. The bishop’s alone is on ${andList(epd.map(([d, n]) => num(n) + ' laws of ' + dateTxt(d)))}; in the signatures the French co-prince is Nicolas Sarkozy up to ${dateTxt(P.sarkozy.last)} and François Hollande from ${dateTxt(P.hollande.first)}, and Hollande up to ${dateTxt(P.hollande.last)} and Emmanuel Macron from ${dateTxt(P.macron.first)}.`),
    draw(el) {
      const w = W(el), nw = narrow(w), order = ['mitterrand', 'chirac', 'sarkozy', 'hollande', 'macron', 'marti', 'vives', 'serrano'].filter(p => P[p]);
      const cards = el.append('div').attr('class', 'ptiles').style('grid-template-columns', `repeat(${nw ? 2 : 4}, minmax(0, 1fr))`);
      order.forEach(p => {
        const o = P[p], d = cards.append('div').attr('class', 'ptile'), yrs = (+yr(o.last) - +yr(o.first)) + DAYS(o.first, o.last) % 365 / 365;
        d.append('div').attr('class', 'pn').html(`<i style="display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:${CPC[o.side]()}"></i>${esc(PRN[p])}`);
        d.append('div').attr('class', 'pv').html(`<b>${fmt(o.n)}</b> ${L('lleis', 'laws')}`);
        d.append('div').attr('class', 'ps').text(`${sideName(o.side)} · ${yr(o.first)}–${yr(o.last)} · ${o.alone ? L(`${fmt(o.alone)} sense l’altre copríncep`, `${fmt(o.alone)} without the other co-prince`) : L('cap sense l’altre', 'none alone')}`);
        const bar = d.append('div').attr('class', 'pbar');
        bar.append('i').style('flex', o.n - o.alone).style('background', CPC.both());
        if (o.alone) bar.append('i').style('flex', o.alone).style('background', CPC[o.side]());
        bindTip(d, () => `<b>${esc(PRN[p])}</b><div class="q">${esc(sideName(o.side))}</div>` + trow(null, L('Lleis signades', 'Laws signed'), fmt(o.n)) + trow(null, L('Primera i última', 'First and last'), `${dateShort(o.first)} – ${dateShort(o.last)}`) +
          trow(CPC[o.side](), L('Sense l’altre copríncep', 'Without the other co-prince'), fmt(o.alone)) + trow(null, L('Lleis qualificades', 'Qualified laws'), fmt(o.q)));
      });
      legend(el, ['both', 'fr', 'ep'].map(k => ({ c: CPC[k](), l: Cap(cpName(k)), shape: 'dot' })));
      // a dot per law, by year of approval, the laws with one signature at the foot of each column; the co-princes' spans below
      const Ys = d3.range(1993, LASTY + 1), m = { t: 6, r: 6, b: 62, l: 6 }, iw = w - m.l - m.r, colW = iw / Ys.length, k = nw ? 2 : 3;
      const r = Math.max(1.6, Math.min(3.4, (colW - 3) / (2 * k) - .5)), stp = 2 * r + 1.1;
      const byY = d3.group(laws, l => +yr(l[1])), mxN = d3.max(Ys, yy => (byY.get(yy) || []).length), ih = Math.ceil(mxN / k) * stp + 6, h = m.t + ih + m.b;
      const svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`), x = yy => (yy - Ys[0]) * colW;
      const rank = { fr: 0, ep: 1, both: 2 };
      Ys.forEach(yy => {
        const ls = (byY.get(yy) || []).slice().sort((a, b) => rank[a[2]] - rank[b[2]] || (a[1] < b[1] ? -1 : 1));
        ls.forEach((l, i) => {
          const cx = x(yy) + colW / 2 + ((i % k) - (k - 1) / 2) * stp, cy = ih - Math.floor(i / k) * stp - r - 1;
          const dot = g.append('circle').attr('cx', cx).attr('cy', cy).attr('r', r).attr('fill', CPC[l[2]]()).attr('opacity', yy === LASTY ? .6 : 1);
          if (l[2] !== 'both') dot.attr('stroke', css('--surface')).attr('stroke-width', .8);
        });
        bindTip(g.append('rect').attr('class', 'hit').attr('x', x(yy)).attr('y', 0).attr('width', colW).attr('height', ih).datum(yy), d => {
          const ls2 = byY.get(d) || [], s1 = ls2.filter(l => l[2] !== 'both');
          return `<b>${d}${d === LASTY ? ' (' + t('partial') + ')' : ''}</b>` + ['both', 'fr', 'ep'].map(kk => { const n = ls2.filter(l => l[2] === kk).length; return n ? trow(CPC[kk](), Cap(cpName(kk)), fmt(n)) : ''; }).join('') +
            s1.slice(0, 5).map(l => `<div class="q">${dateShort(l[1])} · ${esc(nm(l[0]))}</div>`).join('');
        });
      });
      g.append('line').attr('class', 'base').attr('x1', 0).attr('x2', iw).attr('y1', ih).attr('y2', ih);
      yearTicks(1993, LASTY, nw ? 10 : 5).forEach(v => g.append('text').attr('class', 'lbl').attr('x', x(v) + colW / 2).attr('y', ih + 14).attr('text-anchor', 'middle').text(v));
      const spans = (side, row) => {
        const ps = order.filter(p => P[p].side === side), yb = ih + 22 + row * 19;
        g.append('text').attr('class', 'lbl mut').attr('x', 0).attr('y', yb - 3).text('');
        ps.forEach((p, i) => {
          const a = fy(P[p].first), b = i + 1 < ps.length ? fy(P[ps[i + 1]].first) : LASTY + 1, xa = Math.max(0, (a - Ys[0]) * colW), xb = Math.min(iw, (b - Ys[0]) * colW);
          g.append('rect').attr('x', xa + .5).attr('y', yb).attr('width', Math.max(1, xb - xa - 1)).attr('height', 15).attr('rx', 4).attr('fill', mix(CPC[side](), i % 2 ? .62 : .78));
          const lab = [PRN[p], PRS[p]].find(s => textW(el, [s], 'lbl') <= xb - xa - 8);
          if (lab) g.append('text').attr('class', 'lbl').attr('x', (xa + xb) / 2).attr('y', yb + 11).attr('text-anchor', 'middle').style('fill', css('--text')).text(lab);
          bindTip(g.append('rect').attr('class', 'hit').attr('x', xa).attr('y', yb).attr('width', Math.max(2, xb - xa)).attr('height', 15).datum(p), d => `<b>${esc(PRN[d])}</b><div class="q">${esc(sideName(P[d].side))}</div>` +
            trow(null, L('Signa des de', 'Signs from'), dateShort(P[d].first)) + trow(null, L('Lleis', 'Laws'), fmt(P[d].n)));
        });
      };
      spans('fr', 0); spans('ep', 1);
      // the laws with one signature, listed
      const mini = el.append('div').attr('class', 'mini').style('margin-top', '14px');
      ['fr', 'ep'].forEach(side => {
        const ls = one.filter(l => l[2] === side), b = mini.append('div');
        b.append('h4').html(`<i style="display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:${CPC[side]()}"></i>${esc(Cap(cpName(side)))} (${ls.length})`);
        const ul = b.append('ul').style('margin', '4px 0 0').style('padding-left', '18px').style('font-size', '12px').style('color', 'var(--text-2)').style('line-height', '1.55');
        ls.forEach(l => ul.append('li').text(`${dateShort(l[1])} · ${nm(l[0])}${l[6] ? '' : ''}`));
      });
      const pre = c.pre;
      note(el, ['lleis/<ANY>-<NÚMERO>/signatures.md', 'constitucio/article-045.md'], `${fmt(laws.length)} ${L('lleis aprovades des del 3 de maig de 1993', 'laws approved since 3 May 1993')}`,
        L(`els noms es llegeixen del bloc de signatures; unes quantes lleis el tenen al preàmbul o a la darrera disposició, abans dels estatuts o els quadres annexos. Abans de la Constitució, les lleis les promulgaven els delegats permanents dels coprínceps (${pre.delegats || 0}) o els veguers (${pre.veguers || 0}), o porten només la signatura del síndic o del subsíndic (${pre.sindic || 0}). El ${LASTY} arriba al ${dateTxt(PF.last_pub)} (més clar).`,
          `names are read from the signature block; a few laws keep it in the preamble or in their last provision, before annexed statutes or tables. Before the Constitution, laws were promulgated by the co-princes’ permanent delegates (${pre.delegats || 0}) or the veguers (${pre.veguers || 0}), or carry only the Síndic’s or deputy Síndic’s signature (${pre.sindic || 0}). ${LASTY} runs to ${dateTxt(PF.last_pub)} (lighter).`));
      table(el, [L('Data', 'Date'), L('Signatura', 'Signature'), L('Llei', 'Law')], one.map(l => [dateTxt(l[1]), Cap(cpName(l[2])), `${nm(l[0])} (${citeOf(l[0])})`]));
      subTable(el, L('Lleis per copríncep', 'Laws by co-prince'), [L('Copríncep', 'Co-prince'), L('Lleis', 'Laws'), L('Sense l’altre', 'Alone'), L('Primera', 'First'), L('Última', 'Last')],
        order.map(p => [PRN[p], P[p].n, P[p].alone, dateTxt(P[p].first), dateTxt(P[p].last)]), [0, 1, 1, 0, 0]);
    }
  };
});

// 8. the calendar of approvals
chart('c08', el => {
  const c = D.c08, thu = c.dow[3], aug = c.month[7], b0 = c.busiest[0];
  return {
    title: L(`El ${pct(thu, c.n)} de les lleis s’aproven en dijous; a l’agost, ${aug}`, `${pct(thu, c.n)} of laws are approved on a Thursday; in August, ${aug}`),
    toc: L('El calendari', 'The calendar'),
    dek: L(`El dia en què el Consell General aprova cada llei, que és la data de la llei: ${fmt(c.n)} lleis en ${fmt(c.session_days)} dies. Desembre és el mes amb més lleis (${fmt(c.month[11])}), amb els pressupostos i els crèdits de final d’any; el dia amb més lleis, el ${dateTxt(b0[0])}, ${fmt(b0[1])}. Els textos consolidats no hi són: la majoria s’aproven quan passa un mes sense objeccions, no en una sessió.`,
      `The day the Consell General approves each law, which is the law’s date: ${fmt(c.n)} laws on ${fmt(c.session_days)} days. December is the month with the most laws (${fmt(c.month[11])}), with the budgets and year-end credits; the day with the most, ${dateTxt(b0[0])}, ${fmt(b0[1])}. Consolidated texts are left out: most are approved when a month passes without objections, not in a session.`),
    draw(el) {
      const nw = narrow(W(el));
      h4(el, L('Dia de la setmana', 'Day of the week'), 2);
      barList(el, DOW.ca.map((dd, i) => ({ i, n: c.dow[i] })), { label: rr => Cap(DOW[LANG][rr.i]), value: rr => rr.n, max: d3.max(c.dow), color: rr => rr.i === 3 ? css('--s1') : css('--muted-mark'), cap: 120, rw: 92,

        noUp: true, cap: 40, maxCw: 52, ch: nw2 => nw2 ? 12 : 14, gapY: 2, rw: 70, rwn: 46, minText: 16,

      note(el, ['laws.csv (title)', 'signatures.md', 'preamble.md'], `${fmt(c.n)} ${L('lleis', 'laws')}`,
        L(`la data és la de la cita de la llei («Llei 31/2018, del 6 de desembre») o, si no en té, la de la signatura del síndic o la sessió que esmenta el preàmbul. Sense els ${fmt(sum(c.dow_consol))} textos consolidats. El ${LASTY} arriba al ${dateTxt(PF.last_pub)}.`,
          `the date is the law’s own citation date (“Llei 31/2018, del 6 de desembre”) or, failing that, that of the Síndic’s signature or of the session the preamble names. Without the ${fmt(sum(c.dow_consol))} consolidated texts. ${LASTY} runs to ${dateTxt(PF.last_pub)}.`));
      table(el, [t('year'), ...d3.range(12).map(j => MON[LANG][j]), t('total')], YEARS.map(yy => [String(yy), ...(c.cells[yy] || Array(12).fill(0)), sum(c.cells[yy] || [0])]));
      subTable(el, L('Els dies amb més lleis aprovades', 'The days with the most laws approved'), [L('Dia', 'Day'), L('Lleis', 'Laws')], c.busiest.map(b => [dateTxt(b[0]), b[1]]), [0, 1]);
    }
  };
});

// 9. from approval to the BOPA
const LGN = [['fins a 15 dies', 'up to 15 days'], ['16–21 dies', '16–21 days'], ['22–28 dies', '22–28 days'], ['29–35 dies', '29–35 days'], ['més de 35 dies', 'over 35 days']];
chart('c09', el => {
  const c = D.c09, rows = c.terms.filter(r => r.n).map(r => Object.assign({ tm: TERMS.find(x => x.id === r.id) }, r)), post = rows.filter(r => r.id !== 'pre');
  const lo = post.reduce((a, b) => b.med < a.med ? b : a, post[0]), lg = c.long;
  return {
    title: L(`De l’aprovació al BOPA passen ${fmt(c.med)} dies de mediana; amb ${termName(lo.tm, false)}, ${fmt(lo.med)}`,
      `From approval to the BOPA takes a median of ${fmt(c.med)} days; under ${termName(lo.tm, false)}, ${fmt(lo.med)}`),
    toc: L('De l’aprovació al BOPA', 'From approval to the BOPA'),
    dek: L(`Els dies entre la data de cada llei, la de l’aprovació pel Consell General, i la seva publicació al BOPA. Aprovada una llei, el síndic general la tramet als coprínceps, que la sancionen i n’ordenen la publicació entre els vuit i els quinze dies següents (article 63 de la Constitució); en ${fmt(c.within15)} lleis tot plegat no passa de 15 dies. Les més lentes: ${the(lg[0][0])} del 1995 (${lg[0][4]} dies) i ${the(lg[1][0])} del 2014 (${lg[1][4]}).`,
      `The days between each law’s date, its approval by the Consell General, and its publication in the BOPA. Once a law is approved, the Síndic General sends it to the co-princes, who sanction it and order its publication between eight and fifteen days later (Constitution, article 63); for ${fmt(c.within15)} laws the whole takes no more than 15 days. The slowest: ${the(lg[0][0])} of 1995 (${lg[0][4]} days) and ${the(lg[1][0])} of 2014 (${lg[1][4]}).`),
    draw(el) {
      const ramp = seqRamp(), cols = LGN.map((_, i) => ramp(.18 + .82 * i / (LGN.length - 1))), keys = LGN.map((_, i) => 'b' + i);
      const rr = rows.map(r => Object.assign(r, Object.fromEntries(keys.map((k, i) => [k, r.bins[i]]))));
      legend(el, LGN.map((n, i) => ({ c: cols[i], l: LA(n) })));
      const lw = textW(el, rr.map(r => termLabel(r.tm, false))) + 16, lwn = textW(el, rr.map(r => termLabel(r.tm, true))) + 12;
      bands(el, rr, keys, cols, LGN.map(LA), { rowH: 36, l: lw, ln: lwn, r: 96, rn: 64, minIn: 30, label: (r, nw) => termLabel(r.tm, nw),
        right: (r, nw) => nw ? `${fmt(r.med)} d` : L(`${fmt(r.med)} dies`, `${fmt(r.med)} days`), partial: r => r.tm === TERMS[TERMS.length - 1],
        tipExtra: r => trow(null, L('Lleis', 'Laws'), fmt(r.n)) + trow(null, L('Mediana', 'Median'), L(`${fmt(r.med)} dies`, `${fmt(r.med)} days`)) });
      note(el, ['laws.csv (title, published)', 'signatures.md'], `${fmt(sum(rows, r => r.n))} ${L('lleis', 'laws')}`,
        L(`la data de la llei és la de la seva cita o, si no en té, la de la signatura del síndic. A la dreta, la mediana de cada mandat. Fora: ${c.neg.length} lleis del 1993 datades un dia després del butlletí que les publica. El darrer mandat arriba al ${dateTxt(PF.last_pub)} (més clar).`,
          `the law’s date is its citation date or, failing that, the Síndic’s signature date. On the right, each term’s median. Left out: ${c.neg.length} laws of 1993 dated a day after the bulletin that publishes them. The last term runs to ${dateTxt(PF.last_pub)} (lighter).`));
      table(el, [L('Mandat', 'Term'), ...LGN.map(LA), L('Mediana (dies)', 'Median (days)')], rows.map(r => [termLabel(r.tm, false), ...r.bins, r.med]));
      subTable(el, L('Més de 90 dies', 'Over 90 days'), [L('Llei', 'Law'), L('Aprovada', 'Approved'), L('Publicada', 'Published'), L('Dies', 'Days')], lg.map(r => [nmc(r[0]), dateTxt(r[2]), dateTxt(r[3]), r[4]]), [0, 0, 0, 1]);
    }
  };
});

// 10. from the BOPA to entry into force
const VK = ['same', 'next', 'short', 'gen', 'long', 'pre'];
const vkName = k => LA({ same: ['el mateix dia', 'the same day'], next: ['l’endemà', 'the next day'], short: ['de 2 dies a un mes, per la llei', '2 days to a month, by the law'],
  gen: ['15 dies, regla general (la llei no diu res)', '15 days, general rule (the law is silent)'], long: ['més d’un mes', 'over a month'], pre: ['el dia de publicació (abans del 1989)', 'publication day (before 1989’s rule)'] }[k]);
const vkCol = k => k === 'short' ? mix(css('--s1'), .5) : css({ same: '--s2', next: '--s1', gen: '--s4', long: '--s7', pre: '--muted-mark' }[k]);
chart('c10', el => {
  const c = D.c10, T = c.tot, n = sum(VK, k => T[k]), lg = c.long;
  const sh = (a, b, k) => { const ys = d3.range(a, b + 1), m = sum(ys, yy => sum(VK, kk => c.years[yy][kk])); return m ? sum(ys, yy => c.years[yy][k]) / m : 0; };
  return {
    title: L(`El ${pct(T.next, n)} de les lleis entren en vigor l’endemà de publicar-se, i el ${pct(T.same, n)}, el mateix dia`,
      `${pct(T.next, n)} of laws enter into force the day after publication, and ${pct(T.same, n)} the same day`),
    toc: L('L’entrada en vigor', 'Entry into force'),
    dek: L(`Quan entra en vigor cada llei, comptat des del dia en què surt al BOPA, segons la seva pròpia disposició. Si la llei no en diu res, val la regla general del Codi de l’Administració del 1989 (article 9): quinze dies després de la publicació (${fmt(T.gen)} lleis). Fins al 1999 el ${pv(100 * sh(1993, 1999, 'same'))} entraven en vigor el mateix dia de publicar-se; des del 2010, el ${pv(100 * sh(2010, LASTY, 'next'))} ho fan l’endemà. En total, ${fmt(T.long)} lleis s’esperen més d’un mes; les que més, dos anys: ${the(lg[0][0])} i ${the(lg[1][0])}. El ${dateTxt(PF.record_to)}, ${D.c01.future.length} lleis publicades encara no eren en vigor.`,
      `When each law enters into force, counted from the day it appears in the BOPA, by its own provision. If the law is silent, the general rule of the 1989 Administration Code (article 9) applies: fifteen days after publication (${fmt(T.gen)} laws). Up to 1999, ${pv(100 * sh(1993, 1999, 'same'))} entered into force on the day of publication; since 2010, ${pv(100 * sh(2010, LASTY, 'next'))} do so the next day. In all, ${fmt(T.long)} laws wait over a month; the longest, two years: ${the(lg[0][0])} and ${the(lg[1][0])}. On ${dateTxt(PF.record_to)}, ${D.c01.future.length} published laws were not yet in force.`),
    draw(el) {
      legend(el, VK.map(k => ({ c: vkCol(k), l: Cap(vkName(k)) })));
      const w = W(el), nw = narrow(w), h = nw ? 220 : 270, m = { t: 8, r: 8, b: 22, l: nw ? 34 : 40 };
      const svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
      const iw = w - m.l - m.r, ih = h - m.t - m.b, x = d3.scaleLinear().domain([1989, LASTY + 1]).range([0, iw]), step = x(1990) - x(1989), bw = Math.max(2, step - (nw ? 1.5 : 3));
      const y = d3.scaleLinear().domain([0, 1]).range([ih, 0]);
      yAxis(g, y, iw, 4, v => pv(100 * v));
      YEARS.forEach(yy => {
        const o = c.years[yy], tt = sum(VK, k => o[k]), x0 = x(yy) + (step - bw) / 2; if (!tt) return;
        let acc = 0;
        const segs = VK.filter(k => o[k]);
        segs.forEach((k, q) => { const y0 = y(acc / tt) - (q ? 1 : 0), y1 = y((acc + o[k]) / tt); acc += o[k];
          g.append('path').attr('d', q === segs.length - 1 ? colPath(x0, y0, bw, Math.min(y1, y0 - 1), Math.min(3, bw / 2)) : `M${x0},${y0}V${y1 + 1}H${x0 + bw}V${y0}Z`).attr('fill', vkCol(k)).attr('opacity', yy === LASTY ? .55 : 1); });
        bindTip(g.append('rect').attr('class', 'hit').attr('x', x(yy)).attr('width', step).attr('y', 0).attr('height', ih).datum(yy),
          d => `<b>${d}${d === LASTY ? ' (' + t('partial') + ')' : ''}</b>` + VK.map(k => c.years[d][k] ? trow(vkCol(k), Cap(vkName(k)), `${fmt(c.years[d][k])} · ${pct(c.years[d][k], tt)}`) : '').join('') + trow(null, t('total'), fmt(tt)));
      });
      g.append('line').attr('class', 'base').attr('x1', 0).attr('x2', iw).attr('y1', ih).attr('y2', ih);
      yearTicks(1989, LASTY, nw ? 10 : 5).forEach(v => g.append('text').attr('class', 'lbl').attr('x', x(v) + step / 2).attr('y', ih + 15).attr('text-anchor', 'middle').text(v));
      note(el, ['laws.csv (in_force, in_force_basis)', 'git log (In-force:, In-force-basis:)'], `${fmt(n)} ${L('lleis', 'laws')}`,
        L(`cada columna és el 100 % de les lleis publicades aquell any. «Per la llei» vol dir que la llei fixa el termini; «regla general», que no en diu res. Les lleis publicades abans del Codi de l’Administració (abril del 1989) es daten pel dia de publicació. El ${LASTY} arriba al ${dateTxt(PF.last_pub)} (més clar).`,
          `each column is 100% of the laws published that year. “By the law” means the law sets the delay; “general rule”, that it says nothing. Laws published before the Administration Code (April 1989) are dated by their publication day. ${LASTY} runs to ${dateTxt(PF.last_pub)} (lighter).`));
      table(el, [t('year'), ...VK.map(k => Cap(vkName(k))), t('total')], YEARS.map(yy => [String(yy), ...VK.map(k => c.years[yy][k]), sum(VK, k => c.years[yy][k])]));
      subTable(el, L('Les esperes més llargues', 'The longest waits'), [L('Llei', 'Law'), L('Publicada', 'Published'), L('En vigor', 'In force'), L('Dies', 'Days')], lg.map(r => [nmc(r[0]), dateTxt(r[2]), dateTxt(r[3]), r[4]]), [0, 0, 0, 1]);
    }
  };
});

// 11. the anatomy of a new law
const DK = ['add', 'trans', 'derog', 'final'];
const dkName = k => LA({ add: ['disposicions addicionals', 'additional provisions'], trans: ['transitòries', 'transitional'], derog: ['derogatòries', 'repealing'], final: ['finals', 'final'] }[k]);
const dkCol = k => css({ add: '--s3', trans: '--s4', derog: '--s8', final: '--s1' }[k]);
chart('c11', el => {
  const c = D.c11, P = c.periods, a = P[0], b = P[P.length - 1];
  return {
    title: L(`Les disposicions finals d’una llei nova: de ${dec(a.final, 1)} a ${dec(b.final, 1)} de mitjana`, `Final provisions per new law: from ${dec(a.final, 1)} to ${dec(b.final, 1)} on average`),
    toc: L('L’anatomia d’una llei', 'The anatomy of a law'),
    dek: L(`Una llei andorrana té una exposició de motius, els articles i, al final, disposicions addicionals, transitòries, derogatòries i finals. En les lleis noves, la mediana d’articles passa de ${fmt(a.art)} a ${fmt(b.art)}, i les disposicions finals, que fixen l’entrada en vigor i sovint modifiquen altres lleis (gràfic 13), de ${dec(a.final, 1)} a ${dec(b.final, 1)} per llei. L’exposició de motius, de ${fmt(a.motius)} a ${fmt(b.motius)} paraules de mediana.`,
      `An Andorran law has a statement of reasons, its articles and, at the end, additional, transitional, repealing and final provisions. In new laws, the median number of articles goes from ${fmt(a.art)} to ${fmt(b.art)}, and final provisions, which set the entry into force and often amend other laws (chart 13), from ${dec(a.final, 1)} to ${dec(b.final, 1)} per law. The statement of reasons, from a median of ${fmt(a.motius)} to ${fmt(b.motius)} words.`),
    draw(el) {
      legend(el, DK.map(k => ({ c: dkCol(k), l: Cap(dkName(k)) })));
      const rows = P.map(p => Object.assign({ lbl: `${p.p[0]}–${p.p[1]}`, lbln: `${p.p[0]}–${String(p.p[1]).slice(2)}` }, p));
      splitBars(el, rows, DK, DK.map(dkCol), DK.map(k => Cap(dkName(k))), { l: 110, ln: 62, rr: 60, label: (r, nw) => nw ? r.lbln : r.lbl,
        right: r => dec(sum(DK, k => r[k]), 1), tipHead: r => `<div class="q">${L(`mitjana per llei nova, ${fmt(r.n)} lleis`, `average per new law, ${fmt(r.n)} laws`)}</div>` });
      h4(el, L('Paraules de l’exposició de motius (mediana)', 'Words in the statement of reasons (median)'), 16);
      barList(el, rows, { label: r => r.lbl, value: r => r.motius, color: () => css('--s7'), cap: 120, right: r => fmt(r.motius),
        tip: d => `<b>${d.lbl}</b>` + trow(null, L('Mediana de paraules', 'Median words'), fmt(d.motius)) + trow(null, L('Amb exposició de motius', 'With a statement of reasons'), `${fmt(d.has_motius)} ${L('de', 'of')} ${fmt(d.n)}`) });
      note(el, ['lleis/<ANY>-<NÚMERO>/disposicio-*.md', 'preamble.md'], `${fmt(sum(P, p => p.n))} ${L('lleis noves', 'new laws')}`,
        L('cada disposició és un fitxer (disposicio-final-primera.md…); les mitjanes són el total dividit pel nombre de lleis noves del període. «Lleis noves»: sense pressupostos, crèdits, modificacions ni textos consolidats.',
          'each provision is a file (disposicio-final-primera.md…); the averages are the total divided by the number of new laws in the period. “New laws”: without budgets, credits, amendments or consolidated texts.'));
      table(el, [L('Període', 'Period'), L('Lleis noves', 'New laws'), L('Articles (mediana)', 'Articles (median)'), ...DK.map(k => Cap(dkName(k))), L('Exposició de motius (paraules)', 'Statement of reasons (words)')],
        P.map(p => [`${p.p[0]}–${p.p[1]}`, p.n, p.art, dec(p.add, 2), dec(p.trans, 2), dec(p.derog, 2), dec(p.final, 2), p.motius]));
    }
  };
});

// 12. the wording of the entry-into-force clause
chart('c12', el => {
  const c = D.c12, Y = c.years, agg = (a, b, k) => sum(d3.range(a, b + 1), yy => (Y[yy] || {})[k] || 0);
  const s1 = agg(1993, 1999, 'present') / (agg(1993, 1999, 'present') + agg(1993, 1999, 'aquesta')), s2 = agg(2020, LASTY, 'present') / (agg(2020, LASTY, 'present') + agg(2020, LASTY, 'aquesta'));
  const f1 = agg(1993, 1999, 'pres') / (agg(1993, 1999, 'pres') + agg(1993, 1999, 'fut')), f2 = agg(2020, LASTY, 'pres') / (agg(2020, LASTY, 'pres') + agg(2020, LASTY, 'fut'));
  return {
    title: L(`«La present Llei» ha cedit a «Aquesta Llei»: el ${pv(100 * s1)} de les clàusules del 1993–1999, el ${pv(100 * s2)} des del 2020`,
      `“La present Llei” has given way to “Aquesta Llei”: ${pv(100 * s1)} of the clauses in 1993–1999, ${pv(100 * s2)} since 2020`),
    toc: L('Les paraules de la vigència', 'The words of entry into force'),
    dek: L(`La frase amb què cada llei fixa la seva entrada en vigor, tal com la cita el seu commit: «La present Llei entrarà en vigor…» o «Aquesta Llei entra en vigor…». Hi ha dos canvis de redacció: «Aquesta Llei» desplaça «La present Llei», i el present («entra») guanya el futur («entrarà»): del ${pv(100 * f1)} el 1993–1999 al ${pv(100 * f2)} des del 2020. En el text sencer de les lleis, «La present Llei» surt ${fmt(c.text.present)} vegades i «Aquesta Llei», ${fmt(c.text.aquesta)}.`,
      `The sentence in which each law sets its entry into force, as its commit quotes it: “La present Llei entrarà en vigor…” or “Aquesta Llei entra en vigor…” (“The present Law shall enter” / “This Law enters”). Two changes of wording: “Aquesta Llei” displaces “La present Llei”, and the present tense (“entra”) gains on the future (“entrarà”): from ${pv(100 * f1)} in 1993–1999 to ${pv(100 * f2)} since 2020. In the full text of the laws, “La present Llei” occurs ${fmt(c.text.present)} times and “Aquesta Llei” ${fmt(c.text.aquesta)}.`),
    draw(el) {
      const S1 = css('--s2'), S2 = css('--s1'), MIN = 4;
      const sA = YEARS.filter(yy => (Y[yy].present + Y[yy].aquesta) >= MIN).map(yy => [yy, 100 * Y[yy].present / (Y[yy].present + Y[yy].aquesta)]);
      const sF = YEARS.filter(yy => (Y[yy].pres + Y[yy].fut) >= MIN).map(yy => [yy, 100 * Y[yy].pres / (Y[yy].pres + Y[yy].fut)]);
      legend(el, [{ c: S1, l: L('«La present Llei» (en lloc d’«Aquesta Llei»)', '“La present Llei” (rather than “Aquesta Llei”)'), shape: 'line' }, { c: S2, l: L('present «entra» (en lloc de «entrarà»)', 'present “entra” (rather than “entrarà”)'), shape: 'line' }]);
      const r = yearLines(el, [{ pts: sA, color: S1, maxGap: 3 }, { pts: sF, color: S2, maxGap: 3 }], { x0: 1989, x1: LASTY, yMax: 100, nice: false, yFmt: v => pv(v), ticks: yearTicks(1989, LASTY, 5), ticksN: yearTicks(1989, LASTY, 10),
        tip: yy => { const o = Y[yy]; return `<b>${yy}</b>` + trow(null, L('Clàusules', 'Clauses'), fmt(o.n)) + trow(S1, '«La present Llei»', fmt(o.present)) + trow(null, '«Aquesta Llei»', fmt(o.aquesta)) + trow(S2, '«entra»', fmt(o.pres)) + trow(null, '«entrarà»', fmt(o.fut)); } });
      const lA = sA[sA.length - 1], lF = sF[sF.length - 1], dy = Math.abs(r.y(lA[1]) - r.y(lF[1])) < 14 ? 7 : 0;
      halo(r.g, r.x(lA[0]) + 7, r.y(lA[1]) + 4 + (lA[1] < lF[1] ? dy : -dy), pv(lA[1]), 'start', 'lbl strong', S1);
      halo(r.g, r.x(lF[0]) + 7, r.y(lF[1]) + 4 + (lF[1] <= lA[1] ? dy : -dy), pv(lF[1]), 'start', 'lbl strong', S2);
      note(el, ['git log (In force by its own words)'], `${fmt(c.n)} ${L('clàusules', 'clauses')}`,
        L(`només els anys amb almenys ${MIN} clàusules que diuen una de les dues formes; les ${fmt(sum(YEARS, yy => Y[yy].n))} clàusules citades són les de les lleis que fixen el seu propi dia d’entrada en vigor. El darrer any amb «La present Llei» en aquesta clàusula és el ${yr(c.last_present)}.`,
          `only years with at least ${MIN} clauses using one of the two forms; the ${fmt(sum(YEARS, yy => Y[yy].n))} quoted clauses are those of laws that set their own day of entry into force. The last year with “La present Llei” in this clause is ${yr(c.last_present)}.`));
      table(el, [t('year'), L('Clàusules', 'Clauses'), '«La present Llei»', '«Aquesta Llei»', '«entrarà»', '«entra»', '«l’endemà»'], YEARS.map(yy => [String(yy), Y[yy].n, Y[yy].present, Y[yy].aquesta, Y[yy].fut, Y[yy].pres, Y[yy].endema]));
    }
  };
});

part('p3', 'III. Com canvien les lleis', 'III. How the laws change',
  'El repositori guarda cada llei tal com es va aprovar, perquè el BOPA no publica versions consolidades: els canvis que una llei posterior declara («Es modifica l’article 25…») són files de data/amendments.csv, extretes automàticament. Des del 2020, el Consell General aprova textos consolidats com a lleis noves.',
  'The repository keeps each law as enacted, because the BOPA publishes no consolidated versions: the changes a later law states (“Es modifica l’article 25…”) are rows of data/amendments.csv, extracted automatically. Since 2020 the Consell General passes consolidated texts as new laws.');

// 13. the changes later laws state
chart('c13', el => {
  const c = D.c13, Y = c.years, n = c.n, ra = sum(YEARS, yy => Y[yy].ra), fin = (c.by_file.final || 0) + (c.by_file.add || 0) + (c.by_file.trans || 0) + (c.by_file.derog || 0);
  const peak = YEARS.reduce((a, yy) => Y[yy].rows > Y[a].rows ? yy : a, YEARS[0]);
  const CA = css('--s1'), CO = css('--s2');
  return {
    title: L(`${fmt(n)} canvis declarats per lleis posteriors; el ${pct(n - ra, n)}, en lleis que no es titulen de modificació`,
      `${fmt(n)} changes stated by later laws; ${pct(n - ra, n)} in laws not titled as amendments`),
    toc: L('Els canvis declarats', 'Stated changes'),
    dek: L(`Cada canvi és una frase d’una llei posterior que modifica, afegeix, deroga o renumera una part d’una altra llei, per l’any de la llei que el declara. D’aquests canvis, ${fmt(ra)} són en lleis que porten «modificació» al títol; la resta, en lleis noves, pressupostos o textos consolidats que en canvien d’altres, sobretot des de les disposicions finals i addicionals (${pct(fin, n)} de tots els canvis). L’any amb més canvis declarats és el ${peak} (${fmt(Y[peak].rows)}).`,
      `Each change is a sentence of a later law that amends, adds, repeals or renumbers part of another law, by the year of the law that states it. Of these changes, ${fmt(ra)} are in laws whose title says “modificació”; the rest are in new laws, budgets or consolidated texts that change others, mostly from their final and additional provisions (${pct(fin, n)} of all changes). The year with the most stated changes is ${peak} (${fmt(Y[peak].rows)}).`),
    draw(el) {
      legend(el, [{ c: CA, l: L('en lleis titulades de modificació', 'in laws titled as amendments') }, { c: CO, l: L('en altres lleis (noves, pressupostos, textos consolidats)', 'in other laws (new laws, budgets, consolidated texts)') }]);
      const w = W(el), nw = narrow(w), h = nw ? 230 : 280, m = { t: 14, r: 8, b: 22, l: nw ? 34 : 40 };
      const svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
      const iw = w - m.l - m.r, ih = h - m.t - m.b, x = d3.scaleLinear().domain([1989, LASTY + 1]).range([0, iw]), step = x(1990) - x(1989), bw = Math.max(2, step - (nw ? 1.5 : 3));
      const y = d3.scaleLinear().domain([0, d3.max(YEARS, yy => Y[yy].rows)]).nice().range([ih, 0]);
      yAxis(g, y, iw, 4);
      YEARS.forEach(yy => {
        const o = Y[yy], x0 = x(yy) + (step - bw) / 2, a = o.ra, b = o.rows - o.ra;
        if (a) g.append('path').attr('d', b ? `M${x0},${y(0)}V${y(a) + .5}H${x0 + bw}V${y(0)}Z` : colPath(x0, y(0), bw, y(a), Math.min(3, bw / 2))).attr('fill', CA).attr('opacity', yy === LASTY ? .55 : 1);
        if (b) g.append('path').attr('d', colPath(x0, y(a) - (a ? 1 : 0), bw, y(a + b), Math.min(3, bw / 2))).attr('fill', CO).attr('opacity', yy === LASTY ? .55 : 1);
        bindTip(g.append('rect').attr('class', 'hit').attr('x', x(yy)).attr('width', step).attr('y', 0).attr('height', ih).datum(yy), d => {
          const q = Y[d], k = q.kinds || {};
          return `<b>${d}${d === LASTY ? ' (' + t('partial') + ')' : ''}</b>` + trow(CA, L('En lleis de modificació', 'In amending laws'), fmt(q.ra)) + trow(CO, L('En altres lleis', 'In other laws'), fmt(q.rows - q.ra)) +
            trow(null, L('Lleis que declaren canvis', 'Laws stating changes'), fmt(q.laws)) + trow(null, L('Modificacions · addicions · derogacions', 'Amendments · additions · repeals'), `${fmt(k.modification || 0)} · ${fmt(k.insertion || 0)} · ${fmt(k.repeal || 0)}`);
        });
      });
      g.append('line').attr('class', 'base').attr('x1', 0).attr('x2', iw).attr('y1', ih).attr('y2', ih);
      yearTicks(1989, LASTY, nw ? 10 : 5).forEach(v => g.append('text').attr('class', 'lbl').attr('x', x(v) + step / 2).attr('y', ih + 15).attr('text-anchor', 'middle').text(v));
      halo(g, x(peak) - 4, y(Y[peak].rows) + 10, `${peak}: ${fmt(Y[peak].rows)}`, 'end');
      note(el, ['data/amendments.csv'], `${fmt(n)} ${L('canvis', 'changes')}`,
        L(`l’extracció és automàtica, a partir de frases com «Es modifica l’article 25 …», i no és completa ni s’ha revisat a mà: abans del 2004 en troba pocs. «Modificació» vol dir que el títol de la llei que declara el canvi ho diu. El ${LASTY} arriba al ${dateTxt(PF.last_pub)} (més clar).`,
          `the extraction is automatic, from sentences such as “Es modifica l’article 25 …”, and is neither complete nor checked by hand: before 2004 it finds few. “Amending law” means the stating law’s title says “modificació”. ${LASTY} runs to ${dateTxt(PF.last_pub)} (lighter).`));
      table(el, [t('year'), L('Canvis', 'Changes'), L('En lleis de modificació', 'In amending laws'), L('En altres lleis', 'In other laws'), L('Lleis que en declaren', 'Laws stating changes'), L('Modificacions', 'Amendments'), L('Addicions', 'Additions'), L('Derogacions', 'Repeals')],
        YEARS.map(yy => { const o = Y[yy], k = o.kinds || {}; return [String(yy), o.rows, o.ra, o.rows - o.ra, o.laws, k.modification || 0, k.insertion || 0, k.repeal || 0]; }));
    }
  };
});

        L(`la barra és el nombre de lleis diferents que declaren canvis a cada llei; a la dreta, els canvis. Quan data/amendments.csv no dona la carpeta de la llei modificada, se cerca pel nom i la data (o el número) que cita la frase; ${fmt(c.unresolved)} canvis no s’han pogut atribuir.`,

        T.map(r => [nmc(r[0]), r[3], r[4], r[5].modification || 0, r[5].insertion || 0, r[5].repeal || 0]));

// 15. how many new laws a later law changes
chart('c15', el => {

      if (!nw && step >= 20) g.append('text').attr('class', 'lbl mut').attr('x', iw).attr('y', -10).attr('text-anchor', 'end').style('font-size', '10px').text(L('xifres: % amb canvis (anys amb 8 lleis o més)', 'figures: % with changes (years with 8 laws or more)'));

// 16. consolidated texts
chart('c16', el => {
  const nObj = D.c16.texts.filter(x => x.obj).length, T = D.c16.texts.filter(x => x.orig), span = x => (PD(x.ad) - PD(x.orig[2])) / 3.15576e10, mx = T.reduce((a, b) => span(b) > span(a) ? b : a, T[0]);
  const subj = f => nm(f).replace(/\s*\((?:text consolidat|consolidated text)\)$/, '');
  return {
    title: L(`${fmt(D.c16.texts.length)} textos consolidats des del 2020; el del ${subj(mx.f)}, ${Math.round(span(mx))} anys després del text original`,
      `${fmt(D.c16.texts.length)} consolidated texts since 2020; that of the ${subj(mx.f)}, ${Math.round(span(mx))} years after the original text`),
    toc: L('Els textos consolidats', 'Consolidated texts'),
    dek: L(`Des del desembre del 2020, el Consell General aprova textos consolidats: lleis noves que reuneixen una llei i les seves modificacions en un sol text; ${nObj} de les ${D.c16.texts.length} queden aprovades, diuen els seus preàmbuls, perquè en un mes cap conseller ni grup parlamentari no hi presenta objeccions (article 116.6 del Reglament del Consell General). Cada barra va de l’aprovació del text original a la del text consolidat; les marques són les lleis que hi declaren canvis entremig. El repositori guarda tots dos textos, cadascun tal com es va aprovar.`,
      `Since December 2020 the Consell General passes consolidated texts: new laws that gather a law and its amendments in one text; ${nObj} of the ${D.c16.texts.length}, their preambles say, are approved because within a month no councillor or parliamentary group objects (article 116.6 of the Rules of the Consell General). Each bar runs from the approval of the original text to that of the consolidated text; the ticks are the laws stating changes to it in between. The repository keeps both texts, each as enacted.`),
    draw(el) {
      const dup = s0 => T.filter(x => subj(x.f) === s0).length > 1, w = W(el), nw = narrow(w), labs = T.map(x => subj(x.f) + (dup(subj(x.f)) ? ` (${yr(x.ad)})` : '')), up = nw ? 13 : 0, lw = nw ? 0 : Math.min(330, textW(el, labs) + 14), rw = nw ? 82 : 112, rowH = 22 + up;
      const svg = svgIn(el, w, T.length * rowH + 24), g = svg.append('g').attr('transform', `translate(${lw},2)`);
      const iw = w - lw - rw, x = d3.scaleLinear().domain([1989, LASTY + 1]).range([0, iw]), ih = T.length * rowH;
      yearTicks(1989, LASTY, nw ? 10 : 5).forEach(v => { g.append('line').attr('x1', x(v)).attr('x2', x(v)).attr('y1', 0).attr('y2', ih).attr('stroke', css('--grid'));
        g.append('text').attr('class', 'lbl').attr('x', x(v)).attr('y', ih + 14).attr('text-anchor', 'middle').text(v); });
      T.forEach((tx, i) => {
        const y0 = i * rowH + up, by = y0 + 5, x0 = x(fy(tx.orig[2])), x1 = x(fy(tx.ad));
        if (nw) g.append('text').attr('class', 'lbl strong').attr('x', 0).attr('y', y0 - 1).text(labs[i]);
        else g.append('text').attr('class', 'lbl strong').attr('x', -10).attr('y', by + 9).attr('text-anchor', 'end').text(labs[i]);
        g.append('path').attr('d', barPath(x0, by, Math.max(x0 + 4, x1), 12, 4)).attr('fill', mix(css('--s7'), .62));
        tx.am.forEach(a => g.append('line').attr('x1', x(fy(a[2]))).attr('x2', x(fy(a[2]))).attr('y1', by - 1).attr('y2', by + 13).attr('stroke', css('--s1')).attr('stroke-width', 1.6));
        g.append('circle').attr('cx', x1).attr('cy', by + 6).attr('r', 4.5).attr('fill', css('--s7')).attr('stroke', css('--surface')).attr('stroke-width', 1.5);
        g.append('text').attr('class', 'lbl').attr('x', iw + 8).attr('y', by + 10).text(nw ? L(`${Math.round(span(tx))} anys · ${tx.am.length}`, `${Math.round(span(tx))} yrs · ${tx.am.length}`) : L(`${Math.round(span(tx))} anys · ${lleis(tx.am.length)}`, `${Math.round(span(tx))} years · ${lleis(tx.am.length)}`));
        bindTip(g.append('rect').attr('class', 'hit').attr('x', -lw).attr('width', w).attr('y', y0 - up).attr('height', rowH).datum(tx), d =>
          `<b>${esc(nmc(d.f))}</b>${official(d.f)}` + trow(null, L('Text original', 'Original text'), `${citeOf(d.orig[0])} · ${dateShort(d.orig[2])}`) + trow(null, L('Text consolidat', 'Consolidated text'), dateShort(d.ad)) +
          trow(css('--s1'), L('Lleis que hi declaren canvis entremig', 'Laws stating changes in between'), fmt(d.am.length)) + d.am.slice(-4).map(a => `<div class="q">${citeOf(a[0])} · ${dateShort(a[2])}</div>`).join(''));
      });
      legend(el, [{ c: mix(css('--s7'), .62), l: L('del text original al text consolidat', 'from the original to the consolidated text') }, { c: css('--s1'), l: L('llei que hi declara canvis', 'law stating changes to it'), shape: 'line' }, { c: css('--s7'), l: L('text consolidat', 'consolidated text'), shape: 'dot' }]);
      note(el, ['laws.csv (title)', 'data/amendments.csv'], `${fmt(T.length)} ${L('textos consolidats', 'consolidated texts')}`,
        L('el text original és la llei anterior amb el mateix nom (la Llei de cooperació penal internacional del 2000, que el text consolidat del 2021 diu que reuneix, ha canviat de nom). Les marques són canvis declarats a data/amendments.csv, que no és complet; un segon text consolidat (el notariat, 2026) compta també els canvis al primer.',
          'the original text is the earlier law of the same name (the 2000 International Criminal Cooperation Act, which the 2021 consolidated text says it gathers, was renamed). Ticks are changes stated in data/amendments.csv, which is not complete; a second consolidated text (notaries, 2026) also counts the changes to the first.'));
      table(el, [L('Text consolidat', 'Consolidated text'), L('Aprovat', 'Approved'), L('Text original', 'Original text'), L('Anys', 'Years'), L('Lleis amb canvis declarats', 'Laws with stated changes')],
        T.map(x => [nmc(x.f), dateTxt(x.ad), `${citeOf(x.orig[0])} (${dateTxt(x.orig[2])})`, Math.round(span(x)), x.am.length]));
    }
  };
});

part('p4', 'IV. Diners, impostos i Europa', 'IV. Money, taxes and Europe',
  'Els pressupostos de l’Estat i els crèdits que els completen, els impostos que les lleis creen i modifiquen, la moneda en què parlen les lleis i la Unió Europea i altres organismes que esmenten.',

// 17. budgets and credits
chart('c17', el => {

  const miss = c.missing.filter(yy => yy > 1989), cr = YEARS.reduce((a, b) => c.credit[b] > c.credit[a] ? b : a, YEARS[0]), med = median(fys.map(f => B[f].days));
  return {
    title: L(`Només ${early.length} dels ${fys.length} pressupostos s’aproven abans de l’1 de gener; per al ${andList(miss.map(String))}, cap llei de pressupost`,

    dek: L(`La llei del pressupost de cada any i el dia que el Consell General l’aprova, comptat des de l’1 de gener de l’exercici: la mediana, ${fmt(med)} dies després. El més tardà, el del ${late}, aprovat el ${dateTxt(B[late].ad)}. Per al ${andList(miss.map(String))} el registre no té llei de pressupost; el ${cr} té ${fmt(c.credit[cr])} lleis de crèdit extraordinari o de suplement de crèdit, que aproven despeses no previstes (a sota).`,
      `Each year’s budget law and the day the Consell General approves it, counted from 1 January of its year: a median of ${fmt(med)} days after. The latest, for ${late}, approved on ${dateTxt(B[late].ad)}. For ${andList(miss.map(String))} the record has no budget law; ${cr} has ${fmt(c.credit[cr])} laws of extraordinary or supplementary credit, which approve unplanned spending (below).`),
    draw(el) {
      const CL = css('--s4'), CE = css('--s3'), w = W(el), nw = narrow(w), h = nw ? 220 : 260, m = { t: 12, r: 8, b: 22, l: nw ? 36 : 44 };
      legend(el, [{ c: CE, l: L('aprovat abans de l’1 de gener', 'approved before 1 January') }, { c: CL, l: L('aprovat després de l’1 de gener', 'approved after 1 January') }, { c: css('--surface-2'), l: L('cap llei de pressupost al registre', 'no budget law in the record'), shape: 'hatch' }]);

        L('una llei compta si qualsevol dels seus fitxers diu el nom (o la sigla) de la institució; les directives i els reglaments, si se citen amb el número («Directiva (UE) 2015/849»). Els períodes són de cinc anys; l’últim, 2024–2026, arriba al ' + dateTxt(PF.last_pub) + ' (més clar). Les xifres són percentatges de les lleis del període.',
          'a law counts if any of its files gives the body’s name (or acronym); directives and regulations, if cited with their number (“Directiva (UE) 2015/849”). The periods are five years long; the last, 2024–2026, runs to ' + dateTxt(PF.last_pub) + ' (lighter). The figures are percentages of the period’s laws.'));
      table(el, [L('Institució', 'Body'), ...P.map(p => `${p[0]}–${p[1]}`), t('total')], c.bodies.map(k => [LA(BDN[k]), ...c.cells[k], c.tot[k]]).concat([[L('Lleis publicades', 'Laws published'), ...c.ptot, sum(c.ptot)]]));
      subTable(el, L('Lleis que citen directives europees pel número', 'Laws citing EU directives by number'), [L('Any', 'Year'), L('Llei', 'Law'), L('Directives', 'Directives')], c.dirlaws.map(r => [String(r[2]), nmc(r[0]), r[3]]), [0, 0, 1]);
    }
  };
});
// ------------------------------------------------------------------ page
function profileTable() {
  const P = PF, el = d3.select('#profile').html('');
  const rows = [
    [L('Lleis i Constitució', 'Laws and Constitution'), 'lleis/<ANY>-<NÚMERO>/ · constitucio/ · laws.csv', fmt(P.acts + 1), L(`la Constitució i ${fmt(P.acts)} textos del BOPA sota «Lleis» (${fmt(P.lawlike)} lleis i ${fmt(P.docs)} edictes i quadres), del ${dateTxt(P.first_pub)} al ${dateTxt(P.last_pub)}; un fitxer per article, disposició o annex (${fmt(P.files)} fitxers, ${fmt(P.articles)} articles)`, `the Constitution and ${fmt(P.acts)} BOPA texts under “Lleis” (${fmt(P.lawlike)} laws and ${fmt(P.docs)} edicts and tables), from ${dateTxt(P.first_pub)} to ${dateTxt(P.last_pub)}; one file per article, provision or annex (${fmt(P.files)} files, ${fmt(P.articles)} articles)`), L('cada llei tal com es va aprovar; no hi ha decrets ni reglaments del Govern, ni ordinacions dels comuns', 'each law as enacted; Government decrees and regulations and the comuns’ ordinances are not included')],
    [L('Historial de git', 'Git history'), 'git log origin/main · origin/future', fmt(P.acts + 1), L(`un commit per llei, datat el dia que entra en vigor (In-force:, In-force-basis:, Published:, Bulletin:), amb la frase de la llei que en fixa la vigència; ${fmt(P.future)} lleis a la branca future`, `one commit per law, dated the day it enters into force (In-force:, In-force-basis:, Published:, Bulletin:), quoting the law’s sentence on its entry into force; ${fmt(P.future)} laws on the future branch`), L('la història no té modificacions aplicades: cada llei és un sol commit', 'the history applies no amendments: each law is a single commit')],
    [L('Signatures i preàmbuls', 'Signatures and preambles'), 'signatures.md · preamble.md', fmt(P.lawlike), L(`el síndic general, els coprínceps, el lloc i el dia d’aprovació, la sessió i l’exposició de motius; ${fmt(P.signed)} lleis des de la Constitució`, `the Síndic General, the co-princes, the place and day of approval, the session and the statement of reasons; ${fmt(P.signed)} laws since the Constitution`), L('llegits del text; els quadres de pressupost que segueixen les signatures no compten', 'read from the text; budget tables after the signatures do not count')],
    [L('Canvis declarats', 'Stated changes'), 'data/amendments.csv', fmt(P.changes), L(`els canvis que les lleis posteriors declaren, frase a frase, amb la llei modificada (identificada en ${fmt(P.changes - P.unresolved)})`, `the changes later laws state, sentence by sentence, with the amended law (identified for ${fmt(P.changes - P.unresolved)})`), L('extracció automàtica, no completa ni revisada a mà; no s’apliquen al text', 'automatic extraction, neither complete nor checked by hand; not applied to the text')],
    [L('Correccions d’errades', 'Corrections of errata'), 'data/corrections.csv', fmt(P.corrections), L('documents de correcció publicats al BOPA, llistats', 'correction documents published in the BOPA, listed'), L('no s’apliquen; no surten als gràfics', 'not applied; not in the charts')],
  ];
  const tb = el.append('table');
  tb.append('thead').append('tr').selectAll('th').data([t('ds'), t('src'), t('n'), t('cover'), t('caveat')]).join('th').text(d => d);
  const tr = s => Object.entries(PH).reduce((a, [x, y]) => a.split(x).join(LA(y)), s);
  tb.append('tbody').selectAll('tr').data(rows).join('tr').selectAll('td').data(r => r).join('td').html((v, i) => i === 1 ? `<code>${esc(tr(v))}</code>` : esc(v));
}
// a label that runs past the edge of its chart's card would be cut: report it (the charts size their columns to their labels)
function checkLeftLabels(fig) {
  const fr = fig.node().getBoundingClientRect();
  fig.selectAll('svg text').each(function () {
    const r = this.getBoundingClientRect();
    if (r.width && (r.left < fr.left - 0.5 || r.right > fr.right + 0.5)) console.warn('label outside its chart', fig.attr('id'), this.textContent);
  });
}
function render() {
  HATCH = 0;
  document.documentElement.lang = LANG;
  document.title = t('title');
  d3.selectAll('[data-i]').each(function () { this.textContent = t(this.dataset.i).replace('{laws}', fmt(PF.acts)); });
  document.getElementById('gl-link').innerHTML = t('gl');
  d3.selectAll('[data-lang]').attr('aria-pressed', function () { return String(this.dataset.lang === LANG); });
  d3.selectAll('[data-theme-set]').attr('aria-pressed', function () { return String(this.dataset.themeSet === THEME); });
  const one = D.c07.laws.filter(l => l[2] !== 'both').length;
  const tv = [[fmt(PF.lawlike), L('lleis del Consell General, 1989–2026', 'laws of the Consell General, 1989–2026')], [fmt(PF.qualified), L('lleis qualificades', 'qualified laws')],
    [fmt(PF.articles), L('articles (un fitxer cadascun)', 'articles (one file each)')], [dec(PF.words / 1e6, 1) + L(' milions', ' million'), L('de paraules', 'words')],
    [fmt(PF.changes), L('canvis declarats per lleis posteriors', 'changes stated by later laws')], [fmt(one), L('lleis amb la signatura d’un sol copríncep', 'laws signed by one co-prince only')]];
  d3.select('#tiles').html('').selectAll('div').data(tv).join('div').attr('class', 'tile').html(d => `<b>${d[0]}</b><span>${d[1]}</span>`);
  profileTable();
  const main = d3.select('#main').html(''), toc = d3.select('#toc').html('');
  let sec = null, n = 0;
  CH.forEach(c => {
    if (c.part) {
      sec = main.append('section').attr('class', 'part').attr('id', c.id);
      sec.append('h2').text(L(c.ca, c.en)); sec.append('p').attr('class', 'pd').text(L(c.dca, c.den));
      toc.append('a').attr('class', 'p').attr('href', '#' + c.id).text(L(c.ca, c.en));
      return;
    }
    n++;
    const fig = sec.append('figure').attr('class', 'chart').attr('id', c.id);
    let spec;
    try { spec = c.fn(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); return; }
    const h3 = fig.append('h3'); h3.append('span').attr('class', 'no').text(n + '.'); h3.append('span').text(spec.title);
    fig.append('p').attr('class', 'dek').text(spec.dek);
    try { spec.draw(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); }
    checkLeftLabels(fig);
    fig.select('svg').attr('aria-label', spec.title);
    toc.append('a').attr('href', '#' + c.id).text(`${n}. ${spec.toc || spec.title.split(/:\s/)[0]}`);
  });
  d3.select('#foot').text(t('foot').replace('{built}', dateTxt(PF.built) + (PF.head ? ', ' + PF.head.slice(0, 10) : '')).replace('{record}', dateTxt(PF.record_to)));
}
d3.selectAll('[data-lang]').on('click', function () { LANG = this.dataset.lang; try { localStorage.setItem('ad-viz-lang', LANG); } catch (e) {} render(); });
d3.selectAll('[data-theme-set]').on('click', function () {
  THEME = this.dataset.themeSet;
  if (THEME === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', THEME);
  try { localStorage.setItem('ad-viz-theme', THEME); } catch (e) {}
  render();
});
if (THEME !== 'auto') document.documentElement.setAttribute('data-theme', THEME);
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (THEME === 'auto') render(); }); } catch (e) {}
let lastW = innerWidth, rt;
addEventListener('resize', () => { if (Math.abs(innerWidth - lastW) < 40) return; clearTimeout(rt); rt = setTimeout(() => { lastW = innerWidth; const y = scrollY; render(); scrollTo(0, y); }, 200); });
render();
// labels are measured as they are drawn: draw again when the web fonts have loaded, so the measures are the fonts' own
let ft;
const redraw = () => { clearTimeout(ft); ft = setTimeout(() => { const y = scrollY; render(); scrollTo(0, y); }, 120); };
const T0 = Date.now();
if (document.fonts) { if (document.fonts.status !== 'loaded') document.fonts.ready.then(redraw); document.fonts.addEventListener('loadingdone', () => { if (Date.now() - T0 < 15000) redraw(); }); }
</script>
