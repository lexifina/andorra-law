<html lang="ca">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root {
  color-scheme: light;
  --bg: #f7f6f3; --surface: #fcfcfb; --surface-2: #f1f0ec; --line: #e4e2dc; --grid: #ebe9e4;
  --text: #0b0b0b; --text-2: #52514e; --text-3: #7a7974; --accent: #2a78d6;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --muted-mark: #b9b7b0;
  --seq-lo: #eef4fc; --seq-hi: #0d366b;
  --sans: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --serif: "Source Serif 4", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #131312; --surface: #1a1a19; --surface-2: #222220; --line: #33322f; --grid: #2a2a28;
    --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e86; --accent: #3987e5;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
    --muted-mark: #55544f;
    --seq-lo: #1f2a38; --seq-hi: #9ec5f4;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #131312; --surface: #1a1a19; --surface-2: #222220; --line: #33322f; --grid: #2a2a28;
  --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e86; --accent: #3987e5;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
  --muted-mark: #55544f;
  --seq-lo: #1f2a38; --seq-hi: #9ec5f4;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 var(--sans); }
a { color: var(--accent); }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
header.top { padding: 28px 0 8px; }
.bar { display: flex; justify-content: flex-end; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.toggles { display: inline-flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface); }
.seg button { border: 0; background: transparent; color: var(--text-2); font: 500 13px/1 var(--sans); padding: 7px 12px; border-radius: 999px; cursor: pointer; min-height: 30px; }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--surface); }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
h1 { font: 600 clamp(28px, 5vw, 44px)/1.2 var(--serif); margin: 0 0 14px; letter-spacing: -.01em; }
.lede { font-size: 17px; color: var(--text-2); max-width: 780px; margin: 0 0 8px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 26px 0 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 12px; }
.tile b { display: block; font: 600 24px/1.15 var(--sans); font-variant-numeric: tabular-nums; }
.tile span { font-size: 12px; color: var(--text-2); line-height: 1.5; display: block; margin-top: 2px; }
details.profile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin: 10px 0 0; }
details.profile > summary, details.tbl > summary { cursor: pointer; padding: 12px 14px; font-weight: 500; font-size: 14px; list-style: none; }
details.profile > summary::-webkit-details-marker, details.tbl > summary::-webkit-details-marker { display: none; }
details.profile > summary::before, details.tbl > summary::before { content: "▸"; display: inline-block; width: 1.1em; color: var(--text-3); transition: transform .15s; }
details[open].profile > summary::before, details[open].tbl > summary::before { transform: rotate(90deg); }
.scroll { overflow-x: auto; padding: 0 14px 14px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--text-2); font-size: 12px; }
td.n, th.n { text-align: right; white-space: nowrap; }
code { font: 12px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; word-break: break-all; }
nav.toc { margin: 30px 0 10px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 6px 22px; font-size: 13px; }
nav.toc a { color: var(--text-2); text-decoration: none; display: block; padding: 3px 0; line-height: 1.5; }
nav.toc a:hover { color: var(--text); text-decoration: underline; }
nav.toc .p { font-weight: 600; color: var(--text); margin-top: 6px; }
section.part { padding-top: 34px; }
section.part > h2 { font: 600 26px/1.3 var(--serif); margin: 0 0 6px; }
section.part > p.pd { color: var(--text-2); margin: 0 0 6px; max-width: 780px; }
figure.chart { margin: 22px 0 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 6px; }
figure.chart h3 { font: 600 19px/1.45 var(--serif); margin: 0 0 6px; }
figure.chart h3 .no { color: var(--text-3); font-weight: 500; margin-right: .35em; }
.dek { color: var(--text-2); margin: 0 0 12px; max-width: 840px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--text-2); margin: 0 0 8px; line-height: 1.5; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend i.dot { border-radius: 50%; }
.legend i.ring { background: transparent !important; border: 2px solid var(--text-3); border-radius: 50%; }
.legend i.line { height: 2px; width: 14px; border-radius: 1px; vertical-align: 3px; }
.legend i.dash { height: 0; width: 14px; border-radius: 0; border-top: 2px dashed; background: transparent !important; vertical-align: 3px; }
.legend i.hatch { background-image: repeating-linear-gradient(135deg, var(--muted-mark) 0 2px, transparent 2px 5px) !important; background-color: var(--surface-2) !important; }
.legend i.outline { background: transparent !important; border: 2px solid var(--text); border-radius: 3px; }
.plot { width: 100%; position: relative; }
.plot svg { display: block; width: 100%; height: auto; overflow: visible; }
.axis text, .lbl { fill: var(--text-2); font: 11px var(--sans); font-variant-numeric: tabular-nums; }
.lbl.strong { fill: var(--text); font-weight: 500; }
.lbl.mut { fill: var(--text-3); }
.axis path { display: none; }
.axis line, .grid line { stroke: var(--grid); }
.base { stroke: var(--text-3); stroke-width: 1; }
.note { font-size: 12px; color: var(--text-3); margin: 10px 0 4px; line-height: 1.6; }
.note b { color: var(--text-2); font-weight: 500; }
details.tbl { border-top: 1px solid var(--line); margin: 10px -18px 0; }
details.tbl > summary { font-size: 12px; color: var(--text-2); padding: 10px 18px; }
details.tbl .scroll { max-height: 360px; overflow: auto; padding: 0 18px 12px; }
.tip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; line-height: 1.5; box-shadow: 0 6px 24px rgba(0,0,0,.12); max-width: 340px; opacity: 0; transition: opacity .08s; }
.tip b { font-weight: 600; }
.tip .r { display: flex; justify-content: space-between; gap: 14px; }
.tip .r span:last-child { font-variant-numeric: tabular-nums; }
.tip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.tip .q { margin-top: 4px; color: var(--text-2); }
.hit { fill: transparent; cursor: default; }
.mini { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
.mini h4 { margin: 0 0 2px; font: 600 13px/1.4 var(--sans); }
.mini p { margin: 0 0 6px; font-size: 12px; color: var(--text-2); }
.multi { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 18px; }
.multi h4 { margin: 0; font: 600 13px/1.4 var(--sans); overflow-wrap: anywhere; }
.multi p { margin: 0 0 2px; font-size: 12px; color: var(--text-2); }
.ptiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 4px 0 14px; }
.ptile { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.ptile .pn { font: 500 12px/1.4 var(--sans); color: var(--text-2); overflow-wrap: anywhere; }
.ptile .pv { font-size: 12px; color: var(--text-2); margin: 2px 0; }
.ptile .pv b { font: 600 22px/1.15 var(--sans); color: var(--text); font-variant-numeric: tabular-nums; margin-right: 2px; }
.ptile .ps { font-size: 12px; color: var(--text-3); line-height: 1.5; }
.ptile .pbar { display: flex; gap: 2px; height: 6px; margin-top: 8px; border-radius: 3px; overflow: hidden; }
.ptile .pbar i { display: block; }
.sub { margin: 18px 0 4px; font: 600 13px/1.4 var(--sans); }
footer { color: var(--text-3); font-size: 12px; padding: 40px 0 60px; line-height: 1.6; }
@media (max-width: 560px) {
  figure.chart { padding: 14px 12px 4px; border-radius: 12px; }
  details.tbl { margin: 10px -12px 0; }
  details.tbl > summary { padding: 10px 12px; }
  details.tbl .scroll { padding: 0 12px 12px; }
  .lede { font-size: 15px; }
  .multi { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 10px; }
  .ptiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (forced-colors: active) { .seg button[aria-pressed="true"] { outline: 2px solid CanvasText; } }
/* Catalan "l·l": Inter's Catalan form (locl) pulls the dot so tight between the two l's that at small sizes it reads like an H */
body, .plot svg text, .plot svg text.lbl { font-feature-settings: "locl" 0; }
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="bar">
    <span class="toggles">
      <span class="seg" role="group" aria-label="Llengua / Language"><button data-lang="ca">CA</button><button data-lang="en">EN</button></span>
      <span class="seg" role="group" aria-label="Tema / Theme"><button data-theme-set="auto">Auto</button><button data-theme-set="light">☀</button><button data-theme-set="dark">☾</button></span>
    </span>
  </div>
  <h1 data-i="title"></h1>

<script>
const DATA = /*DATA*/null;
</script>
<script>
"use strict";
const D = DATA.charts, PF = DATA.profile, TT = DATA.titles;
const LANGS = ['ca', 'en'];
let LANG = 'ca';
try { const q = new URLSearchParams(location.search).get('lang'); if (LANGS.includes(q)) LANG = q; else { const s = localStorage.getItem('ad-viz-lang'); if (LANGS.includes(s)) LANG = s; } } catch (e) {}
let THEME = 'auto';
try { const tt = localStorage.getItem('ad-viz-theme'); if (tt === 'light' || tt === 'dark') THEME = tt; } catch (e) {}

// ------------------------------------------------------------------ strings
const GL = '<a href="https://github.com/lexifina/global-law/tree/main/visualisations">global-law visualisations/</a>';
const S = {
ca: {
  title: 'El dret andorrà en 20 gràfics',
  lede: 'Vint gràfics dibuixats només amb les dades d’aquest repositori: la Constitució del 1993 i els {laws} textos del Consell General que el Butlletí Oficial del Principat d’Andorra (BOPA) publica com a lleis des del 1989, cadascun tal com es va aprovar, amb un fitxer per article o disposició i un commit per llei, datat el dia que va entrar en vigor.',
  profile_h: 'Perfil de les dades: què s’ha fet servir i fins on arriba',
  tbl: 'Taula de dades', src: 'Font al repositori', n: 'Registres', cover: 'Cobertura', caveat: 'Límits',
  ds: 'Dades', foot: 'Elaborat a partir del repositori lexifina/andorra-law ({built}). Els textos són els que publica el Butlletí Oficial del Principat d’Andorra (BOPA), tal com es van aprovar: el BOPA no publica versions consolidades, i aquí no s’hi apliquen les modificacions posteriors. Aquest repositori no l’ha elaborat, patrocinat ni avalat el Servei del Butlletí Oficial del Principat d’Andorra. Dades fins al {record}. Les xifres les calcula visualisations/src/prep.py a partir de l’historial de git, els fitxers de cada llei i les taules del repositori; build.py compon la pàgina. Els gràfics descriuen el que conté el registre, no les causes.',
  year: 'Any', total: 'Total', share: 'Percentatge', count: 'Nombre', partial: 'any incomplet',
  gl: 'Gràfics del dret de tots els països, a partir de tot global-law: ' + GL + '. Aquí, només els d’Andorra.',
},
en: {
  title: 'Andorran law in 20 charts',
  lede: 'Twenty charts drawn only from the data in this repository: the 1993 Constitution and the {laws} texts of the Consell General that the Butlletí Oficial del Principat d’Andorra (BOPA) has published as laws since 1989, each as enacted, with one file per article or provision and one commit per law, dated the day it entered into force.',
  profile_h: 'Data profile: what was used and how far it goes',
  tbl: 'Data table', src: 'Source in the repository', n: 'Records', cover: 'Coverage', caveat: 'Limit',
  ds: 'Dataset', foot: 'Built from the lexifina/andorra-law repository ({built}). The texts are those the Butlletí Oficial del Principat d’Andorra (BOPA) publishes, as enacted: the BOPA publishes no consolidated versions, and later amendments are not applied here. This repository is not made, sponsored or endorsed by the Servei del Butlletí Oficial del Principat d’Andorra. Data to {record}. The numbers are computed by visualisations/src/prep.py from the git history, the files of each law and the repository’s tables; build.py assembles the page. The charts describe what the record holds, not why.',
  year: 'Year', total: 'Total', share: 'Share', count: 'Count', partial: 'partial year',
  gl: 'Charts on every country’s law, from the whole of global-law: ' + GL + '. These are the charts on Andorra alone.',
}};
const t = k => S[LANG][k];
const L = (ca, en) => LANG === 'ca' ? ca : en;
const LA = a => Array.isArray(a) ? L(a[0], a[1]) : a;
const grp = s => s.replace(/\B(?=(\d{3})+(?!\d))/g, LANG === 'ca' ? '.' : ',');
const dec = (v, d = 1) => { const s = Math.abs(+v).toFixed(d); const [a, b] = s.split('.'); return (+v < 0 && +s !== 0 ? '−' : '') + grp(a) + (b ? (LANG === 'ca' ? ',' : '.') + b : ''); };
const fmt = n => (n == null ? '–' : Number.isInteger(+n) ? (+n < 0 ? '−' : '') + grp(String(Math.abs(Math.round(+n)))) : dec(+n, 1));
const pv = (v, d = 0) => dec(v, d) + (LANG === 'ca' ? ' %' : '%');
const pct = (a, b, d = 0) => b ? pv(100 * a / b, d) : '–';
const MES = ['gener', 'febrer', 'març', 'abril', 'maig', 'juny', 'juliol', 'agost', 'setembre', 'octubre', 'novembre', 'desembre'];
const MEN = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const MON = { ca: ['gen', 'febr', 'març', 'abr', 'maig', 'juny', 'jul', 'ag', 'set', 'oct', 'nov', 'des'], en: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'] };
const DOW = { ca: ['dilluns', 'dimarts', 'dimecres', 'dijous', 'divendres', 'dissabte', 'diumenge'], en: ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'] };
const deMes = m => (/^[aeiouàèéíòóú]/i.test(MES[m - 1]) ? 'd’' : 'de ') + MES[m - 1];
const delAny = y => (+y >= 2000 ? 'del ' : 'de ') + y;
const dateTxt = s => { const [y, m, d] = s.split('-').map(Number); return LANG === 'ca' ? `${d} ${deMes(m)} ${delAny(y)}` : `${d} ${MEN[m - 1]} ${y}`; };
const dateShort = s => { const [y, m, d] = s.split('-').map(Number); return LANG === 'ca' ? `${d} ${MON.ca[m - 1]} ${y}` : `${d} ${MON.en[m - 1]} ${y}`; };
const monthTxt = s => { const [y, m] = s.split('-').map(Number); return LANG === 'ca' ? `${MES[m - 1]} ${delAny(y)}` : `${MEN[m - 1]} ${y}`; };
const dayMonth = (m, d) => LANG === 'ca' ? `${d} ${deMes(m)}` : `${d} ${MEN[m - 1]}`;
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sum = (a, f) => a.reduce((s, d) => s + (f ? f(d) : d), 0);
const PD = s => d3.timeParse('%Y-%m-%d')(s);
const DAYS = (a, b) => Math.round((PD(b) - PD(a)) / 864e5);
const Cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const nn = (n, ca, en) => LANG === 'ca' ? `${fmt(n)} ${n === 1 ? ca[0] : ca[1]}` : `${fmt(n)} ${n === 1 ? en[0] : en[1]}`;
const andList = a => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + L(' i ', ' and ') + a[a.length - 1];
const median = a => { const s = [...a].sort((x, y) => x - y), n = s.length; return n ? (n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2) : null; };
const yr = s => s.slice(0, 4);
const mix = (c, k) => d3.interpolateRgb(c, css('--surface'))(k);
const lleis = n => nn(n, ['llei', 'lleis'], ['law', 'laws']);
const YEARS = d3.range(1989, +PF.record_to.slice(0, 4) + 1);
const LASTY = YEARS[YEARS.length - 1];

// ------------------------------------------------------------------ laws: short names in each language, and citations
const NM = {
  'constitucio': ['Constitució', 'Constitution'],
  'lleis/1989-02-26-143be': ['Codi de procediment penal', 'Code of Criminal Procedure'],
  'lleis/1989-04-09-14772': ['Codi de l’Administració', 'Administration Code'],
  'lleis/1990-07-29-13922': ['Codi penal', 'Criminal Code'],
  'lleis/1991-06-27-124ca': ['Llei de l’impost de mercaderies indirecte (IMI)', 'Indirect Goods Tax Act (IMI)'],
  'lleis/1993-09-27-2e62': ['Llei qualificada del Tribunal Constitucional', 'Qualified Law on the Constitutional Court'],
  'lleis/1993-09-27-58d2': ['Llei qualificada del règim electoral i del referèndum', 'Qualified Law on Elections and Referendums'],
  'lleis/1993-09-27-7cf6': ['Llei qualificada de la Justícia', 'Qualified Law on Justice'],
  'lleis/1993-09-27-e8aa': ['Llei qualificada de la nacionalitat', 'Qualified Law on Nationality'],
  'lleis/1994-05-03-2102': ['Llei del cànon sobre el consum d’electricitat i telèfon', 'Electricity and Telephone Levy Act'],
  'lleis/1994-05-03-68be': ['Llei de la taxa sobre la tinença de vehicles', 'Vehicle Ownership Charge Act'],
  'lleis/1994-07-26-b502': ['Llei del coeficient d’inversions obligatòries', 'Mandatory Investment Ratio Act'],
  'lleis/1994-07-26-bcae': ['Modificació de l’Estatut orgànic del Servei de Telecomunicacions', 'Amendment of the Statute of the Telecommunications Service'],
  'lleis/1995-08-01-c9de': ['Llei qualificada del matrimoni', 'Qualified Law on Marriage'],
  'lleis/1996-01-16-84c2': ['Llei de la taxa sobre el Registre de Titulars d’Activitats Econòmiques', 'Business Register Charge Act'],
  'lleis/1996-01-30-4852': ['Llei qualificada de la nacionalitat', 'Qualified Law on Nationality'],
  'lleis/1996-07-09-b61a': ['Codi de duana', 'Customs Code'],
  'lleis/1996-04-23-b302': ['Llei qualificada de l’adopció', 'Qualified Law on Adoption'],
  'lleis/2000-11-07-1f2e2': ['Llei de mesures per a la transició cap a l’euro', 'Euro Transition Act'],
  'lleis/2004-015': ['Llei qualificada d’incapacitació i organismes tutelars', 'Qualified Law on Incapacity and Guardianship'],
  'lleis/2013-008': ['Llei de les entitats operatives del sistema financer', 'Financial System Entities Act'],
  'lleis/2014-026': ['Llei de patents', 'Patents Act'],
  'lleis/2014-046': ['Llei de la successió per causa de mort', 'Succession Act'],
  'lleis/2017-014': ['Llei de prevenció i lluita contra el blanqueig', 'Anti-Money-Laundering Act'],
  'lleis/2018-020': ['Llei del Fons Andorrà de Garantia de Dipòsits', 'Deposit Guarantee Fund Act'],
  'lleis/2018-036': ['Llei de conglomerats financers', 'Financial Conglomerates Act'],
  'lleis/2022-022': ['Llei de seguretat de les xarxes i els sistemes d’informació', 'Network and Information Security Act'],
  'lleis/2022-028': ['Llei qualificada de protecció civil', 'Qualified Law on Civil Protection'],

// 5. the codes

// 10. from the BOPA to entry into force
const VK = ['same', 'next', 'short', 'gen', 'long', 'pre'];
const vkName = k => LA({ same: ['el mateix dia', 'the same day'], next: ['l’endemà', 'the next day'], short: ['de 2 dies a un mes, per la llei', '2 days to a month, by the law'],
  gen: ['15 dies, regla general (la llei no diu res)', '15 days, general rule (the law is silent)'], long: ['més d’un mes', 'over a month'], pre: ['el dia de publicació (abans del 1989)', 'publication day (before 1989’s rule)'] }[k]);
const vkCol = k => k === 'short' ? mix(css('--s1'), .5) : css({ same: '--s2', next: '--s1', gen: '--s4', long: '--s7', pre: '--muted-mark' }[k]);
chart('c10', el => {
  const c = D.c10, T = c.tot, n = sum(VK, k => T[k]), lg = c.long;
  const sh = (a, b, k) => { const ys = d3.range(a, b + 1), m = sum(ys, yy => sum(VK, kk => c.years[yy][kk])); return m ? sum(ys, yy => c.years[yy][k]) / m : 0; };
  return {
    title: L(`El ${pct(T.next, n)} de les lleis entren en vigor l’endemà de publicar-se, i el ${pct(T.same, n)}, el mateix dia`,
      `${pct(T.next, n)} of laws enter into force the day after publication, and ${pct(T.same, n)} the same day`),
    toc: L('L’entrada en vigor', 'Entry into force'),
    dek: L(`Quan entra en vigor cada llei, comptat des del dia en què surt al BOPA, segons la seva pròpia disposició. Si la llei no en diu res, val la regla general del Codi de l’Administració del 1989 (article 9): quinze dies després de la publicació (${fmt(T.gen)} lleis). Fins al 1999 el ${pv(100 * sh(1993, 1999, 'same'))} entraven en vigor el mateix dia de publicar-se; des del 2010, el ${pv(100 * sh(2010, LASTY, 'next'))} ho fan l’endemà. En total, ${fmt(T.long)} lleis s’esperen més d’un mes; les que més, dos anys: ${the(lg[0][0])} i ${the(lg[1][0])}. El ${dateTxt(PF.record_to)}, ${D.c01.future.length} lleis publicades encara no eren en vigor.`,
      `When each law enters into force, counted from the day it appears in the BOPA, by its own provision. If the law is silent, the general rule of the 1989 Administration Code (article 9) applies: fifteen days after publication (${fmt(T.gen)} laws). Up to 1999, ${pv(100 * sh(1993, 1999, 'same'))} entered into force on the day of publication; since 2010, ${pv(100 * sh(2010, LASTY, 'next'))} do so the next day. In all, ${fmt(T.long)} laws wait over a month; the longest, two years: ${the(lg[0][0])} and ${the(lg[1][0])}. On ${dateTxt(PF.record_to)}, ${D.c01.future.length} published laws were not yet in force.`),
    draw(el) {
      legend(el, VK.map(k => ({ c: vkCol(k), l: Cap(vkName(k)) })));
      const w = W(el), nw = narrow(w), h = nw ? 220 : 270, m = { t: 8, r: 8, b: 22, l: nw ? 34 : 40 };
      const svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
      const iw = w - m.l - m.r, ih = h - m.t - m.b, x = d3.scaleLinear().domain([1989, LASTY + 1]).range([0, iw]), step = x(1990) - x(1989), bw = Math.max(2, step - (nw ? 1.5 : 3));
      const y = d3.scaleLinear().domain([0, 1]).range([ih, 0]);
      yAxis(g, y, iw, 4, v => pv(100 * v));
      YEARS.forEach(yy => {
        const o = c.years[yy], tt = sum(VK, k => o[k]), x0 = x(yy) + (step - bw) / 2; if (!tt) return;
        let acc = 0;
        const segs = VK.filter(k => o[k]);
        segs.forEach((k, q) => { const y0 = y(acc / tt) - (q ? 1 : 0), y1 = y((acc + o[k]) / tt); acc += o[k];
          g.append('path').attr('d', q === segs.length - 1 ? colPath(x0, y0, bw, Math.min(y1, y0 - 1), Math.min(3, bw / 2)) : `M${x0},${y0}V${y1 + 1}H${x0 + bw}V${y0}Z`).attr('fill', vkCol(k)).attr('opacity', yy === LASTY ? .55 : 1); });
        bindTip(g.append('rect').attr('class', 'hit').attr('x', x(yy)).attr('width', step).attr('y', 0).attr('height', ih).datum(yy),
          d => `<b>${d}${d === LASTY ? ' (' + t('partial') + ')' : ''}</b>` + VK.map(k => c.years[d][k] ? trow(vkCol(k), Cap(vkName(k)), `${fmt(c.years[d][k])} · ${pct(c.years[d][k], tt)}`) : '').join('') + trow(null, t('total'), fmt(tt)));
      });
      g.append('line').attr('class', 'base').attr('x1', 0).attr('x2', iw).attr('y1', ih).attr('y2', ih);
      yearTicks(1989, LASTY, nw ? 10 : 5).forEach(v => g.append('text').attr('class', 'lbl').attr('x', x(v) + step / 2).attr('y', ih + 15).attr('text-anchor', 'middle').text(v));
      note(el, ['laws.csv (in_force, in_force_basis)', 'git log (In-force:, In-force-basis:)'], `${fmt(n)} ${L('lleis', 'laws')}`,
        L(`cada columna és el 100 % de les lleis publicades aquell any. «Per la llei» vol dir que la llei fixa el termini; «regla general», que no en diu res. Les lleis publicades abans del Codi de l’Administració (abril del 1989) es daten pel dia de publicació. El ${LASTY} arriba al ${dateTxt(PF.last_pub)} (més clar).`,
          `each column is 100% of the laws published that year. “By the law” means the law sets the delay; “general rule”, that it says nothing. Laws published before the Administration Code (April 1989) are dated by their publication day. ${LASTY} runs to ${dateTxt(PF.last_pub)} (lighter).`));
      table(el, [t('year'), ...VK.map(k => Cap(vkName(k))), t('total')], YEARS.map(yy => [String(yy), ...VK.map(k => c.years[yy][k]), sum(VK, k => c.years[yy][k])]));
      subTable(el, L('Les esperes més llargues', 'The longest waits'), [L('Llei', 'Law'), L('Publicada', 'Published'), L('En vigor', 'In force'), L('Dies', 'Days')], lg.map(r => [nmc(r[0]), dateTxt(r[2]), dateTxt(r[3]), r[4]]), [0, 0, 0, 1]);
    }
  };

      note(el, ['lleis/<ANY>-<NÚMERO>/disposicio-*.md', 'preamble.md'], `${fmt(sum(P, p => p.n))} ${L('lleis noves', 'new laws')}`,

          'each provision is a file (disposicio-final-primera.md…); the averages are the total divided by the number of new laws in the period. “New laws”: without budgets, credits, amendments or consolidated texts.'));
      table(el, [L('Període', 'Period'), L('Lleis noves', 'New laws'), L('Articles (mediana)', 'Articles (median)'), ...DK.map(k => Cap(dkName(k))), L('Exposició de motius (paraules)', 'Statement of reasons (words)')],
        P.map(p => [`${p.p[0]}–${p.p[1]}`, p.n, p.art, dec(p.add, 2), dec(p.trans, 2), dec(p.derog, 2), dec(p.final, 2), p.motius]));
    }
  };
});

// 12. the wording of the entry-into-force clause
chart('c12', el => {
  const c = D.c12, Y = c.years, agg = (a, b, k) => sum(d3.range(a, b + 1), yy => (Y[yy] || {})[k] || 0);
  const s1 = agg(1993, 1999, 'present') / (agg(1993, 1999, 'present') + agg(1993, 1999, 'aquesta')), s2 = agg(2020, LASTY, 'present') / (agg(2020, LASTY, 'present') + agg(2020, LASTY, 'aquesta'));
  const f1 = agg(1993, 1999, 'pres') / (agg(1993, 1999, 'pres') + agg(1993, 1999, 'fut')), f2 = agg(2020, LASTY, 'pres') / (agg(2020, LASTY, 'pres') + agg(2020, LASTY, 'fut'));
  return {
    title: L(`«La present Llei» ha cedit a «Aquesta Llei»: el ${pv(100 * s1)} de les clàusules del 1993–1999, el ${pv(100 * s2)} des del 2020`,
      `“La present Llei” has given way to “Aquesta Llei”: ${pv(100 * s1)} of the clauses in 1993–1999, ${pv(100 * s2)} since 2020`),
    toc: L('Les paraules de la vigència', 'The words of entry into force'),
    dek: L(`La frase amb què cada llei fixa la seva entrada en vigor, tal com la cita el seu commit: «La present Llei entrarà en vigor…» o «Aquesta Llei entra en vigor…». Hi ha dos canvis de redacció: «Aquesta Llei» desplaça «La present Llei», i el present («entra») guanya el futur («entrarà»): del ${pv(100 * f1)} el 1993–1999 al ${pv(100 * f2)} des del 2020. En el text sencer de les lleis, «La present Llei» surt ${fmt(c.text.present)} vegades i «Aquesta Llei», ${fmt(c.text.aquesta)}.`,
      `The sentence in which each law sets its entry into force, as its commit quotes it: “La present Llei entrarà en vigor…” or “Aquesta Llei entra en vigor…” (“The present Law shall enter” / “This Law enters”). Two changes of wording: “Aquesta Llei” displaces “La present Llei”, and the present tense (“entra”) gains on the future (“entrarà”): from ${pv(100 * f1)} in 1993–1999 to ${pv(100 * f2)} since 2020. In the full text of the laws, “La present Llei” occurs ${fmt(c.text.present)} times and “Aquesta Llei” ${fmt(c.text.aquesta)}.`),
    draw(el) {
      const S1 = css('--s2'), S2 = css('--s1'), MIN = 4;
      const sA = YEARS.filter(yy => (Y[yy].present + Y[yy].aquesta) >= MIN).map(yy => [yy, 100 * Y[yy].present / (Y[yy].present + Y[yy].aquesta)]);
      const sF = YEARS.filter(yy => (Y[yy].pres + Y[yy].fut) >= MIN).map(yy => [yy, 100 * Y[yy].pres / (Y[yy].pres + Y[yy].fut)]);
      legend(el, [{ c: S1, l: L('«La present Llei» (en lloc d’«Aquesta Llei»)', '“La present Llei” (rather than “Aquesta Llei”)'), shape: 'line' }, { c: S2, l: L('present «entra» (en lloc de «entrarà»)', 'present “entra” (rather than “entrarà”)'), shape: 'line' }]);
      const r = yearLines(el, [{ pts: sA, color: S1, maxGap: 3 }, { pts: sF, color: S2, maxGap: 3 }], { x0: 1989, x1: LASTY, yMax: 100, nice: false, yFmt: v => pv(v), ticks: yearTicks(1989, LASTY, 5), ticksN: yearTicks(1989, LASTY, 10),
        tip: yy => { const o = Y[yy]; return `<b>${yy}</b>` + trow(null, L('Clàusules', 'Clauses'), fmt(o.n)) + trow(S1, '«La present Llei»', fmt(o.present)) + trow(null, '«Aquesta Llei»', fmt(o.aquesta)) + trow(S2, '«entra»', fmt(o.pres)) + trow(null, '«entrarà»', fmt(o.fut)); } });
      const lA = sA[sA.length - 1], lF = sF[sF.length - 1], dy = Math.abs(r.y(lA[1]) - r.y(lF[1])) < 14 ? 7 : 0;
      halo(r.g, r.x(lA[0]) + 7, r.y(lA[1]) + 4 + (lA[1] < lF[1] ? dy : -dy), pv(lA[1]), 'start', 'lbl strong', S1);
      halo(r.g, r.x(lF[0]) + 7, r.y(lF[1]) + 4 + (lF[1] <= lA[1] ? dy : -dy), pv(lF[1]), 'start', 'lbl strong', S2);
      note(el, ['git log (In force by its own words)'], `${fmt(c.n)} ${L('clàusules', 'clauses')}`,
        L(`només els anys amb almenys ${MIN} clàusules que diuen una de les dues formes; les ${fmt(sum(YEARS, yy => Y[yy].n))} clàusules citades són les de les lleis que fixen el seu propi dia d’entrada en vigor. El darrer any amb «La present Llei» en aquesta clàusula és el ${yr(c.last_present)}.`,
          `only years with at least ${MIN} clauses using one of the two forms; the ${fmt(sum(YEARS, yy => Y[yy].n))} quoted clauses are those of laws that set their own day of entry into force. The last year with “La present Llei” in this clause is ${yr(c.last_present)}.`));
      table(el, [t('year'), L('Clàusules', 'Clauses'), '«La present Llei»', '«Aquesta Llei»', '«entrarà»', '«entra»', '«l’endemà»'], YEARS.map(yy => [String(yy), Y[yy].n, Y[yy].present, Y[yy].aquesta, Y[yy].fut, Y[yy].pres, Y[yy].endema]));
    }
  };
});

part('p3', 'III. Com canvien les lleis', 'III. How the laws change',
  'El repositori guarda cada llei tal com es va aprovar, perquè el BOPA no publica versions consolidades: els canvis que una llei posterior declara («Es modifica l’article 25…») són files de data/amendments.csv, extretes automàticament. Des del 2020, el Consell General aprova textos consolidats com a lleis noves.',
  'The repository keeps each law as enacted, because the BOPA publishes no consolidated versions: the changes a later law states (“Es modifica l’article 25…”) are rows of data/amendments.csv, extracted automatically. Since 2020 the Consell General passes consolidated texts as new laws.');

// 13. the changes later laws state
chart('c13', el => {
  const c = D.c13, Y = c.years, n = c.n, ra = sum(YEARS, yy => Y[yy].ra), fin = (c.by_file.final || 0) + (c.by_file.add || 0) + (c.by_file.trans || 0) + (c.by_file.derog || 0);
  const peak = YEARS.reduce((a, yy) => Y[yy].rows > Y[a].rows ? yy : a, YEARS[0]);
  const CA = css('--s1'), CO = css('--s2');
  return {
    title: L(`${fmt(n)} canvis declarats per lleis posteriors; el ${pct(n - ra, n)}, en lleis que no es titulen de modificació`,
      `${fmt(n)} changes stated by later laws; ${pct(n - ra, n)} in laws not titled as amendments`),
    toc: L('Els canvis declarats', 'Stated changes'),
    dek: L(`Cada canvi és una frase d’una llei posterior que modifica, afegeix, deroga o renumera una part d’una altra llei, per l’any de la llei que el declara. D’aquests canvis, ${fmt(ra)} són en lleis que porten «modificació» al títol; la resta, en lleis noves, pressupostos o textos consolidats que en canvien d’altres, sobretot des de les disposicions finals i addicionals (${pct(fin, n)} de tots els canvis). L’any amb més canvis declarats és el ${peak} (${fmt(Y[peak].rows)}).`,
      `Each change is a sentence of a later law that amends, adds, repeals or renumbers part of another law, by the year of the law that states it. Of these changes, ${fmt(ra)} are in laws whose title says “modificació”; the rest are in new laws, budgets or consolidated texts that change others, mostly from their final and additional provisions (${pct(fin, n)} of all changes). The year with the most stated changes is ${peak} (${fmt(Y[peak].rows)}).`),
    draw(el) {
      legend(el, [{ c: CA, l: L('en lleis titulades de modificació', 'in laws titled as amendments') }, { c: CO, l: L('en altres lleis (noves, pressupostos, textos consolidats)', 'in other laws (new laws, budgets, consolidated texts)') }]);
      const w = W(el), nw = narrow(w), h = nw ? 230 : 280, m = { t: 14, r: 8, b: 22, l: nw ? 34 : 40 };
      const svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
      const iw = w - m.l - m.r, ih = h - m.t - m.b, x = d3.scaleLinear().domain([1989, LASTY + 1]).range([0, iw]), step = x(1990) - x(1989), bw = Math.max(2, step - (nw ? 1.5 : 3));
      const y = d3.scaleLinear().domain([0, d3.max(YEARS, yy => Y[yy].rows)]).nice().range([ih, 0]);
      yAxis(g, y, iw, 4);
      YEARS.forEach(yy => {
        const o = Y[yy], x0 = x(yy) + (step - bw) / 2, a = o.ra, b = o.rows - o.ra;
        if (a) g.append('path').attr('d', b ? `M${x0},${y(0)}V${y(a) + .5}H${x0 + bw}V${y(0)}Z` : colPath(x0, y(0), bw, y(a), Math.min(3, bw / 2))).attr('fill', CA).attr('opacity', yy === LASTY ? .55 : 1);
        if (b) g.append('path').attr('d', colPath(x0, y(a) - (a ? 1 : 0), bw, y(a + b), Math.min(3, bw / 2))).attr('fill', CO).attr('opacity', yy === LASTY ? .55 : 1);
        bindTip(g.append('rect').attr('class', 'hit').attr('x', x(yy)).attr('width', step).attr('y', 0).attr('height', ih).datum(yy), d => {
          const q = Y[d], k = q.kinds || {};
          return `<b>${d}${d === LASTY ? ' (' + t('partial') + ')' : ''}</b>` + trow(CA, L('En lleis de modificació', 'In amending laws'), fmt(q.ra)) + trow(CO, L('En altres lleis', 'In other laws'), fmt(q.rows - q.ra)) +
            trow(null, L('Lleis que declaren canvis', 'Laws stating changes'), fmt(q.laws)) + trow(null, L('Modificacions · addicions · derogacions', 'Amendments · additions · repeals'), `${fmt(k.modification || 0)} · ${fmt(k.insertion || 0)} · ${fmt(k.repeal || 0)}`);
        });
      });
      g.append('line').attr('class', 'base').attr('x1', 0).attr('x2', iw).attr('y1', ih).attr('y2', ih);
      yearTicks(1989, LASTY, nw ? 10 : 5).forEach(v => g.append('text').attr('class', 'lbl').attr('x', x(v) + step / 2).attr('y', ih + 15).attr('text-anchor', 'middle').text(v));
      halo(g, x(peak) - 4, y(Y[peak].rows) + 10, `${peak}: ${fmt(Y[peak].rows)}`, 'end');
      note(el, ['data/amendments.csv'], `${fmt(n)} ${L('canvis', 'changes')}`,
        L(`l’extracció és automàtica, a partir de frases com «Es modifica l’article 25 …», i no és completa ni s’ha revisat a mà: abans del 2004 en troba pocs. «Modificació» vol dir que el títol de la llei que declara el canvi ho diu. El ${LASTY} arriba al ${dateTxt(PF.last_pub)} (més clar).`,
          `the extraction is automatic, from sentences such as “Es modifica l’article 25 …”, and is neither complete nor checked by hand: before 2004 it finds few. “Amending law” means the stating law’s title says “modificació”. ${LASTY} runs to ${dateTxt(PF.last_pub)} (lighter).`));
      table(el, [t('year'), L('Canvis', 'Changes'), L('En lleis de modificació', 'In amending laws'), L('En altres lleis', 'In other laws'), L('Lleis que en declaren', 'Laws stating changes'), L('Modificacions', 'Amendments'), L('Addicions', 'Additions'), L('Derogacions', 'Repeals')],
        YEARS.map(yy => { const o = Y[yy], k = o.kinds || {}; return [String(yy), o.rows, o.ra, o.rows - o.ra, o.laws, k.modification || 0, k.insertion || 0, k.repeal || 0]; }));
    }
  };
});

      table(el, [L('Llei', 'Law'), L('Lleis que hi declaren canvis', 'Laws stating changes'), L('Canvis', 'Changes'), L('Modificacions', 'Amendments'), L('Addicions', 'Additions'), L('Derogacions', 'Repeals')],
        T.map(r => [nmc(r[0]), r[3], r[4], r[5].modification || 0, r[5].insertion || 0, r[5].repeal || 0]));

// 15. how many new laws a later law changes
chart('c15', el => {

// 16. consolidated texts
chart('c16', el => {

      `Since December 2020 the Consell General passes consolidated texts: new laws that gather a law and its amendments in one text; ${nObj} of the ${D.c16.texts.length}, their preambles say, are approved because within a month no councillor or parliamentary group objects (article 116.6 of the Rules of the Consell General). Each bar runs from the approval of the original text to that of the consolidated text; the ticks are the laws stating changes to it in between. The repository keeps both texts, each as enacted.`),
    draw(el) {

// 17. budgets and credits
chart('c17', el => {

        bindTip(g.append('rect').attr('class', 'hit').attr('x', x(yy)).attr('width', step).attr('y', 0).attr('height', ih).datum(yy), d => B[d]

chart('c18', el => {

      `Each row is a tax or charge with its own law in the record; dark cells are the year of the law that regulates it, and blue ones the years of laws that amend it by title or state changes to it. Until 2010 most are indirect taxes and charges (the 1991 IMI, the taxes on services of 2000–2004); December 2010 brings the taxes on non-resident income, on companies and on business income, the IGI comes in ${yIGI} and personal income tax in ${yIRPF}.`),

// 19. currencies

      halo(r.g, r.x(ex) + 6, 12, L('2000: llei de transició a l’euro', '2000: euro transition law'), 'start', 'lbl mut');

      note(el, ['lleis/<ANY>-<NÚMERO>/*.md'], `${fmt(s(1989, LASTY, 'n'))} ${L('lleis', 'laws')}`,
        L('una llei compta si qualsevol dels seus fitxers diu «pesseta(es)» o «PTA», o «euro(s)» o «€»; els francs, si diu «francs francesos» o «FF». Els punts aïllats després del 2003 són mencions històriques de pessetes.',
          'a law counts if any of its files says “pesseta(es)” or “PTA”, or “euro(s)” or “€”; francs, if it says “francs francesos” or “FF”. Isolated dots after 2003 are historical mentions of pesetas.'));
      table(el, [t('year'), L('Lleis', 'Laws'), L('Pessetes', 'Pesetas'), L('Euros', 'Euros'), L('Francs francesos', 'French francs')], YEARS.map(yy => [String(yy), Y[yy].n, Y[yy].pta, Y[yy].eur, Y[yy].frf]));
    }
  };
});

// 20. Europe and international bodies
const BDN = { eu: ['Unió Europea o Comunitat Europea', 'European Union or Community'], acts: ['Directives o reglaments de la UE pel número', 'EU directives or regulations by number'], monetari: ['Acord monetari amb la UE', 'Monetary Agreement with the EU'],
  coe: ['Consell d’Europa', 'Council of Europe'], onu: ['Nacions Unides', 'United Nations'], ocde: ['OCDE', 'OECD'], gafi: ['GAFI o MONEYVAL', 'FATF or MONEYVAL'] };
chart('c20', el => {
  const c = D.c20, P = c.periods, j = P.findIndex(p => p[0] === 2019), shr = k => c.cells[k][j] / c.ptot[j];
  return {
    title: L(`La Unió Europea, esmentada en el ${pv(100 * shr('eu'))} de les lleis del 2019–2023; ${fmt(c.n_dirs)} directives europees citades pel número`,
      `The European Union is mentioned in ${pv(100 * shr('eu'))} of the laws of 2019–2023; ${fmt(c.n_dirs)} EU directives cited by number`),
    toc: L('Europa i els organismes', 'Europe and international bodies'),
    dek: L(`Per a cada període de cinc anys, les lleis publicades (claret) i les que esmenten cada institució (fosc), amb el percentatge a sobre. La Unió Europea passa del ${pct(c.cells.eu[0], c.ptot[0])} de les lleis del 1989–1993 al ${pv(100 * shr('eu'))} del 2019–2023. L’Acord monetari amb la UE surt per primer cop el ${yr(c.first_monetari[2])}; ${fmt(c.dirlaws.length)} lleis citen directives pel número, sobretot les del sistema financer.`,
      `For each five-year period, the laws published (light) and those mentioning each body (dark), with the share on top. The European Union goes from ${pct(c.cells.eu[0], c.ptot[0])} of the laws of 1989–1993 to ${pv(100 * shr('eu'))} of 2019–2023. The Monetary Agreement with the EU first appears in ${yr(c.first_monetari[2])}; ${fmt(c.dirlaws.length)} laws cite directives by number, mostly those on the financial system.`),
    draw(el) {
      const grid = el.append('div').attr('class', 'multi');
      const cells = c.bodies.map(k => { const cell = grid.append('div'); cell.append('h4').text(LA(BDN[k])); cell.append('p').text(L(`${fmt(c.tot[k])} lleis`, `${fmt(c.tot[k])} laws`)); return [k, cell]; });
      legend(el, [{ c: mix(css('--s1'), .72), l: L('lleis publicades', 'laws published') }, { c: css('--s1'), l: L('lleis que l’esmenten', 'laws mentioning it') }]);
      cells.forEach(([k, cell]) => {
        const w = Math.max(140, cell.node().getBoundingClientRect().width || 220), h = 128, m = { t: 16, r: 2, b: 18, l: 2 };
        const svg = cell.append('div').attr('class', 'plot').append('svg').attr('viewBox', `0 0 ${w} ${h}`).attr('width', w).attr('height', h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
        const iw = w - m.l - m.r, ih = h - m.t - m.b, step = iw / P.length, bw = Math.min(22, step * .72), y = d3.scaleLinear().domain([0, d3.max(c.ptot)]).range([ih, 0]);
        P.forEach((p, i) => {
          const x0 = i * step + (step - bw) / 2, n = c.ptot[i], v = c.cells[k][i], f = i === P.length - 1 ? .6 : 1;
          g.append('path').attr('d', colPath(x0, ih, bw, y(n), 3)).attr('fill', mix(css('--s1'), .72)).attr('opacity', f);
          if (v) g.append('path').attr('d', colPath(x0 + bw * .2, ih, bw * .6, Math.min(y(v), ih - 2), 2)).attr('fill', css('--s1')).attr('opacity', f);
          g.append('text').attr('class', 'lbl').attr('x', x0 + bw / 2).attr('y', y(n) - 4).attr('text-anchor', 'middle').style('font-size', '10px').text(v ? Math.round(100 * v / n) + (step < 26 ? '' : LANG === 'ca' ? ' %' : '%') : '');
          if (i % 2 === 0) g.append('text').attr('class', 'lbl mut').attr('x', x0 + bw / 2).attr('y', ih + 13).attr('text-anchor', 'middle').style('font-size', '10px').text(`’${String(p[0]).slice(2)}`);
          bindTip(g.append('rect').attr('class', 'hit').attr('x', i * step).attr('y', 0).attr('width', step).attr('height', ih).datum(i), ii => `<b>${esc(LA(BDN[k]))}</b><div class="q">${P[ii][0]}–${P[ii][1]}</div>` +
            trow(css('--s1'), L('Lleis que l’esmenten', 'Laws mentioning it'), `${fmt(c.cells[k][ii])} · ${pct(c.cells[k][ii], c.ptot[ii])}`) + trow(mix(css('--s1'), .72), L('Lleis publicades', 'Laws published'), fmt(c.ptot[ii])));
        });
        g.append('line').attr('class', 'base').attr('x1', 0).attr('x2', iw).attr('y1', ih).attr('y2', ih);
      });
      h4(el, L('Les lleis que citen més directives europees', 'The laws citing the most EU directives'), 16);
      barList(el, c.dirlaws.slice(0, 8), { label: r => `${r[2]} · ${nm(r[0])}`, value: r => r[3], color: () => css('--s1'), cap: 470, rw: 96, right: r => L(`${r[3]} directives`, `${r[3]} directives`),
        tip: d => `<b>${esc(nmc(d[0]))}</b>${official(d[0])}` + trow(null, L('Directives citades pel número', 'Directives cited by number'), fmt(d[3])) });
      note(el, ['lleis/<ANY>-<NÚMERO>/*.md'], `${fmt(sum(c.ptot))} ${L('lleis', 'laws')}`,
        L('una llei compta si qualsevol dels seus fitxers diu el nom (o la sigla) de la institució; les directives i els reglaments, si se citen amb el número («Directiva (UE) 2015/849»). Els períodes són de cinc anys; l’últim, 2024–2026, arriba al ' + dateTxt(PF.last_pub) + ' (més clar). Les xifres són percentatges de les lleis del període.',
          'a law counts if any of its files gives the body’s name (or acronym); directives and regulations, if cited with their number (“Directiva (UE) 2015/849”). The periods are five years long; the last, 2024–2026, runs to ' + dateTxt(PF.last_pub) + ' (lighter). The figures are percentages of the period’s laws.'));
      table(el, [L('Institució', 'Body'), ...P.map(p => `${p[0]}–${p[1]}`), t('total')], c.bodies.map(k => [LA(BDN[k]), ...c.cells[k], c.tot[k]]).concat([[L('Lleis publicades', 'Laws published'), ...c.ptot, sum(c.ptot)]]));
      subTable(el, L('Lleis que citen directives europees pel número', 'Laws citing EU directives by number'), [L('Any', 'Year'), L('Llei', 'Law'), L('Directives', 'Directives')], c.dirlaws.map(r => [String(r[2]), nmc(r[0]), r[3]]), [0, 0, 1]);
    }
  };
});
// ------------------------------------------------------------------ page
function profileTable() {
  const P = PF, el = d3.select('#profile').html('');
  const rows = [
    [L('Lleis i Constitució', 'Laws and Constitution'), 'lleis/<ANY>-<NÚMERO>/ · constitucio/ · laws.csv', fmt(P.acts + 1), L(`la Constitució i ${fmt(P.acts)} textos del BOPA sota «Lleis» (${fmt(P.lawlike)} lleis i ${fmt(P.docs)} edictes i quadres), del ${dateTxt(P.first_pub)} al ${dateTxt(P.last_pub)}; un fitxer per article, disposició o annex (${fmt(P.files)} fitxers, ${fmt(P.articles)} articles)`, `the Constitution and ${fmt(P.acts)} BOPA texts under “Lleis” (${fmt(P.lawlike)} laws and ${fmt(P.docs)} edicts and tables), from ${dateTxt(P.first_pub)} to ${dateTxt(P.last_pub)}; one file per article, provision or annex (${fmt(P.files)} files, ${fmt(P.articles)} articles)`), L('cada llei tal com es va aprovar; no hi ha decrets ni reglaments del Govern, ni ordinacions dels comuns', 'each law as enacted; Government decrees and regulations and the comuns’ ordinances are not included')],
    [L('Historial de git', 'Git history'), 'git log origin/main · origin/future', fmt(P.acts + 1), L(`un commit per llei, datat el dia que entra en vigor (In-force:, In-force-basis:, Published:, Bulletin:), amb la frase de la llei que en fixa la vigència; ${fmt(P.future)} lleis a la branca future`, `one commit per law, dated the day it enters into force (In-force:, In-force-basis:, Published:, Bulletin:), quoting the law’s sentence on its entry into force; ${fmt(P.future)} laws on the future branch`), L('la història no té modificacions aplicades: cada llei és un sol commit', 'the history applies no amendments: each law is a single commit')],
    [L('Signatures i preàmbuls', 'Signatures and preambles'), 'signatures.md · preamble.md', fmt(P.lawlike), L(`el síndic general, els coprínceps, el lloc i el dia d’aprovació, la sessió i l’exposició de motius; ${fmt(P.signed)} lleis des de la Constitució`, `the Síndic General, the co-princes, the place and day of approval, the session and the statement of reasons; ${fmt(P.signed)} laws since the Constitution`), L('llegits del text; els quadres de pressupost que segueixen les signatures no compten', 'read from the text; budget tables after the signatures do not count')],
    [L('Canvis declarats', 'Stated changes'), 'data/amendments.csv', fmt(P.changes), L(`els canvis que les lleis posteriors declaren, frase a frase, amb la llei modificada (identificada en ${fmt(P.changes - P.unresolved)})`, `the changes later laws state, sentence by sentence, with the amended law (identified for ${fmt(P.changes - P.unresolved)})`), L('extracció automàtica, no completa ni revisada a mà; no s’apliquen al text', 'automatic extraction, neither complete nor checked by hand; not applied to the text')],
    [L('Correccions d’errades', 'Corrections of errata'), 'data/corrections.csv', fmt(P.corrections), L('documents de correcció publicats al BOPA, llistats', 'correction documents published in the BOPA, listed'), L('no s’apliquen; no surten als gràfics', 'not applied; not in the charts')],
  ];
  const tb = el.append('table');
  tb.append('thead').append('tr').selectAll('th').data([t('ds'), t('src'), t('n'), t('cover'), t('caveat')]).join('th').text(d => d);
  const tr = s => Object.entries(PH).reduce((a, [x, y]) => a.split(x).join(LA(y)), s);
  tb.append('tbody').selectAll('tr').data(rows).join('tr').selectAll('td').data(r => r).join('td').html((v, i) => i === 1 ? `<code>${esc(tr(v))}</code>` : esc(v));
}
// a label that runs past the edge of its chart's card would be cut: report it (the charts size their columns to their labels)
function checkLeftLabels(fig) {
  const fr = fig.node().getBoundingClientRect();
  fig.selectAll('svg text').each(function () {
    const r = this.getBoundingClientRect();
    if (r.width && (r.left < fr.left - 0.5 || r.right > fr.right + 0.5)) console.warn('label outside its chart', fig.attr('id'), this.textContent);
  });
}
function render() {
  HATCH = 0;
  document.documentElement.lang = LANG;
  document.title = t('title');
  d3.selectAll('[data-i]').each(function () { this.textContent = t(this.dataset.i).replace('{laws}', fmt(PF.acts)); });
  document.getElementById('gl-link').innerHTML = t('gl');
  d3.selectAll('[data-lang]').attr('aria-pressed', function () { return String(this.dataset.lang === LANG); });
  d3.selectAll('[data-theme-set]').attr('aria-pressed', function () { return String(this.dataset.themeSet === THEME); });
  const one = D.c07.laws.filter(l => l[2] !== 'both').length;
  const tv = [[fmt(PF.lawlike), L('lleis del Consell General, 1989–2026', 'laws of the Consell General, 1989–2026')], [fmt(PF.qualified), L('lleis qualificades', 'qualified laws')],
    [fmt(PF.articles), L('articles (un fitxer cadascun)', 'articles (one file each)')], [dec(PF.words / 1e6, 1) + L(' milions', ' million'), L('de paraules', 'words')],
    [fmt(PF.changes), L('canvis declarats per lleis posteriors', 'changes stated by later laws')], [fmt(one), L('lleis amb la signatura d’un sol copríncep', 'laws signed by one co-prince only')]];
  d3.select('#tiles').html('').selectAll('div').data(tv).join('div').attr('class', 'tile').html(d => `<b>${d[0]}</b><span>${d[1]}</span>`);
  profileTable();
  const main = d3.select('#main').html(''), toc = d3.select('#toc').html('');
  let sec = null, n = 0;
  CH.forEach(c => {
    if (c.part) {
      sec = main.append('section').attr('class', 'part').attr('id', c.id);
      sec.append('h2').text(L(c.ca, c.en)); sec.append('p').attr('class', 'pd').text(L(c.dca, c.den));
      toc.append('a').attr('class', 'p').attr('href', '#' + c.id).text(L(c.ca, c.en));
      return;
    }
    n++;
    const fig = sec.append('figure').attr('class', 'chart').attr('id', c.id);
    let spec;
    try { spec = c.fn(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); return; }
    const h3 = fig.append('h3'); h3.append('span').attr('class', 'no').text(n + '.'); h3.append('span').text(spec.title);
    fig.append('p').attr('class', 'dek').text(spec.dek);
    try { spec.draw(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); }
    checkLeftLabels(fig);
    fig.select('svg').attr('aria-label', spec.title);
    toc.append('a').attr('href', '#' + c.id).text(`${n}. ${spec.toc || spec.title.split(/:\s/)[0]}`);
  });
  d3.select('#foot').text(t('foot').replace('{built}', dateTxt(PF.built) + (PF.head ? ', ' + PF.head.slice(0, 10) : '')).replace('{record}', dateTxt(PF.record_to)));
}
d3.selectAll('[data-lang]').on('click', function () { LANG = this.dataset.lang; try { localStorage.setItem('ad-viz-lang', LANG); } catch (e) {} render(); });
d3.selectAll('[data-theme-set]').on('click', function () {
  THEME = this.dataset.themeSet;
  if (THEME === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', THEME);
  try { localStorage.setItem('ad-viz-theme', THEME); } catch (e) {}
  render();
});
if (THEME !== 'auto') document.documentElement.setAttribute('data-theme', THEME);
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (THEME === 'auto') render(); }); } catch (e) {}
let lastW = innerWidth, rt;
addEventListener('resize', () => { if (Math.abs(innerWidth - lastW) < 40) return; clearTimeout(rt); rt = setTimeout(() => { lastW = innerWidth; const y = scrollY; render(); scrollTo(0, y); }, 200); });
render();
// labels are measured as they are drawn: draw again when the web fonts have loaded, so the measures are the fonts' own
let ft;
const redraw = () => { clearTimeout(ft); ft = setTimeout(() => { const y = scrollY; render(); scrollTo(0, y); }, 120); };
const T0 = Date.now();
if (document.fonts) { if (document.fonts.status !== 'loaded') document.fonts.ready.then(redraw); document.fonts.addEventListener('loadingdone', () => { if (Date.now() - T0 < 15000) redraw(); }); }
</script>
